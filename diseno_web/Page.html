// ─── useCountUp ──────────────────────────────────────────────────────────────
function useCountUp(target, duration = 1200, start = false) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!start) return;
    let startTime = null;
    const step = (ts) => {
      if (!startTime) startTime = ts;
      const p = Math.min((ts - startTime) / duration, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(ease * target));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [target, duration, start]);
  return val;
}

// ─── useInView ───────────────────────────────────────────────────────────────
function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setInView(true); }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

// ─── ScoreCard ───────────────────────────────────────────────────────────────
function ScoreCard({ label, score, maxScore, colorVar, badge, active, onClick, t, started }) {
  const animated = useCountUp(score || 0, 1200, started);
  const pct = maxScore ? (animated / maxScore) * 100 : 0;
  return (
    <div onClick={onClick} style={{
      background: active ? t.bg3 : t.bg2,
      border: `1px solid ${active ? colorVar : t.border}`,
      borderRadius: 12,
      padding: '18px 20px',

      transition: 'all 0.2s',
      boxShadow: active ? `0 0 0 1px ${colorVar}44` : 'none',
    }}>

        <span style={{ fontFamily:'DM Sans', fontWeight:600, color: t.txt, fontSize:15 }}>{label}</span>
        <span style={{
          background: colorVar + '22',
          color: colorVar,
          border: `1px solid ${colorVar}44`,
          borderRadius: 20,
          padding: '2px 10px',
          fontSize: 12,
          fontWeight: 600,
        }}>{badge}</span>
      </div>
      {maxScore ? (
        <>
          <div style={{ display:'flex', alignItems:'baseline', gap:4, marginBottom:8 }}>
            <span style={{ fontFamily:'Syne', fontWeight:800, fontSize:32, color: colorVar }}>{animated}</span>
            <span style={{ color: t.txtMuted, fontSize:14 }}>/ {maxScore}</span>
          </div>
          <div style={{ height:6, borderRadius:3, background: t.bg3, overflow:'hidden' }}>
            <div style={{ height:'100%', borderRadius:3, background: colorVar, width:`${pct}%`, transition:'width 1.2s cubic-bezier(0.16,1,0.3,1)' }} />
          </div>
        </>
      ) : (
        <div style={{ fontFamily:'Syne', fontWeight:800, fontSize:32, color: t.txtFaint }}>N/A</div>
      )}
    </div>
  );
}

// ─── MetricRow ───────────────────────────────────────────────────────────────

// ─── ScanOverlay ─────────────────────────────────────────────────────────────
function ScanOverlay({ onDone, url, t }) {
  const [phase, setPhase] = useState('scanning'); // scanning | done
  const [progress, setProgress] = useState(0);
  const [currentCheck, setCurrentCheck] = useState('Iniciando auditoría...');
  const checks = [
    'Conectando con Google CrUX...',
    'Analizando Core Web Vitals...',
    'Auditando SEO técnico...',
    'Mapeando presencia digital...',
    'Consultando Claude AI...',
    '¡Reporte listo!',
  ];
  useEffect(() => {
    let i = 0;
    const interval = setInterval(() => {
      i++;
      setProgress(Math.min(i * 18, 98));
      setCurrentCheck(checks[Math.min(i - 1, checks.length - 1)]);
      if (i >= checks.length) {
        clearInterval(interval);
        setProgress(100);
        setTimeout(() => { setPhase('done'); setTimeout(onDone, 800); }, 600);
      }
    }, 420);
    return () => clearInterval(interval);
  }, []);

  return (
    <div style={{
      position:'fixed', inset:0, zIndex:1000,
      background:'rgba(10,15,10,0.95)',
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      backdropFilter:'blur(8px)',

            borderRadius:'50%',
            border:`1.5px solid ${t.accent}`,
            animation:`radarPulse 2.4s ease-out ${i * 0.6}s infinite`,
            opacity:0,

          position:'absolute', inset:'50%', transform:'translate(-50%,-50%)',
          width:100, height:100, objectFit:'contain',
          filter: 'brightness(0) invert(1) sepia(1) saturate(3) hue-rotate(70deg)',
          animation:'spin 8s linear infinite',

        {/* Scan line */}
        <div style={{
          position:'absolute', left:0, right:0, height:2,
          background:`linear-gradient(90deg, transparent, ${t.accent}, transparent)`,
          animation:'scanLine 1.8s linear infinite',
          borderRadius:1,
        }} />
      </div>
      <div style={{ textAlign:'center' }}>
        <div style={{ fontFamily:'Syne', fontWeight:800, fontSize:22, color:t.txt, marginBottom:8 }}>

          <div style={{ height:'100%', background:t.accent, width:`${progress}%`, transition:'width 0.4s ease', borderRadius:2 }} />
        </div>
        <div style={{ color:t.txtMuted, fontSize:12, marginTop:8 }}>{progress}%</div>
      </div>
    </div>
  );
}

              <div style={{ display:'flex', borderBottom:`1px solid ${t.border}` }}>
                {[['metrics','📊 Métricas'],['ai','🤖 EDA AI']].map(([key, label]) => (
                  <button key={key} onClick={() => setActiveTab(key)} style={{
                    flex:1, padding:'14px', background:'transparent', border:'none',
                    borderBottom: activeTab===key ? `2px solid ${t.accent}` : '2px solid transparent',
                    color: activeTab===key ? t.txt : t.txtMuted,
                    fontSize:14, fontWeight:600, cursor:'pointer', fontFamily:'DM Sans',
                    transition:'all 0.15s',
                  }}>{label}</button>
                ))}
              </div>

              <div style={{ padding:24 }}>
                {activeTab === 'metrics' && (
                  <div>
                    <div style={{ marginBottom:8, color:t.txtFaint, fontSize:12, fontWeight:600, letterSpacing:'0.08em', textTransform:'uppercase' }}>dian.gov.co · Core Web Vitals</div>
                    <MetricRow label="LCP" value="2.1s" status="GOOD" t={t} />
                    <MetricRow label="FCP" value="1.8s" status="GOOD" t={t} />
                    <MetricRow label="CLS" value="0.10" status="NEEDS IMPROVEMENT" t={t} />
                    <MetricRow label="TTFB" value="450ms" status="GOOD" t={t} />
                    <div style={{ marginTop:20, display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12 }}>
                      {[['Domain Authority','Media'],['HTTPS','✓ Activo'],['Sitemap','✓ Detectado']].map(([k,v]) => (
                        <div key={k} style={{ background:t.bg3, borderRadius:8, padding:'12px 14px' }}>
                          <div style={{ color:t.txtFaint, fontSize:11, marginBottom:4, fontWeight:600 }}>{k}</div>
                          <div style={{ color:t.txt, fontSize:14, fontWeight:600 }}>{v}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'ai' && (
                  <div style={{ display:'flex', flexDirection:'column', height:320 }}>
                    <div style={{ flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:12, marginBottom:16 }}>
                      {chatMessages.map((msg, i) => (
                        <div key={i} style={{
                          alignSelf: msg.role==='ai' ? 'flex-start' : 'flex-end',
                          maxWidth:'80%',
                          background: msg.role==='ai' ? t.bg3 : t.accent + '22',
                          border: `1px solid ${msg.role==='ai' ? t.border : t.accent + '44'}`,
                          borderRadius: msg.role==='ai' ? '4px 12px 12px 12px' : '12px 4px 12px 12px',
                          padding:'10px 14px',
                          fontSize:13,
                          color:t.txt,
                          lineHeight:1.6,
                        }}>
                          {msg.role==='ai' && <span style={{ display:'block', color:t.accent, fontSize:11, fontWeight:700, marginBottom:4 }}>EDA AI</span>}
                          {msg.text}
                        </div>
                      ))}
                    </div>
                    {/* Suggestions */}
                    <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:10 }}>
                      {['¿Cómo mejorar el CLS?','¿Qué es el LCP?','Ver competidores'].map(q => (
                        <button key={q} onClick={() => { setChatInput(q); }} style={{
                          background:'transparent', border:`1px solid ${t.border}`,
                          color:t.txtMuted, borderRadius:20, padding:'4px 10px', fontSize:11,
                          cursor:'pointer', fontFamily:'DM Sans',
                          transition:'all 0.15s',
                        }}
                        onMouseEnter={e => { e.currentTarget.style.borderColor = t.accent; e.currentTarget.style.color = t.accent; }}
                        onMouseLeave={e => { e.currentTarget.style.borderColor = t.border; e.currentTarget.style.color = t.txtMuted; }}
                        >{q}</button>
                      ))}
                    </div>
                    <div style={{ display:'flex', gap:8 }}>
                      <input
                        value={chatInput}
                        onChange={e => setChatInput(e.target.value)}
                        onKeyDown={e => e.key==='Enter' && handleChat()}
                        placeholder="Pregunta algo sobre tu sitio..."
                        style={{
                          flex:1, background:t.bg3, border:`1px solid ${t.border}`,
                          borderRadius:8, padding:'8px 12px', color:t.txt,
                          fontFamily:'DM Sans', fontSize:13, outline:'none',
                        }}
                      />
                      <button onClick={handleChat} style={{
                        background:t.accent, color:'#fff', border:'none', borderRadius:8,
                        padding:'8px 14px', fontSize:13, fontWeight:600, cursor:'pointer',
                      }}>→</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* ─── CÓMO FUNCIONA ─── */}
      <section id="cómo-funciona" style={{ background:t.bg2, padding:'96px 24px', borderTop:`1px solid ${t.borderSoft}` }}>
        <div style={{ maxWidth:1120, margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:64 }}>
            <h2 style={{ fontFamily:'Syne', fontWeight:800, fontSize:'clamp(28px,3.5vw,48px)', letterSpacing:'-1.5px', color:t.txt }}>Tres pasos. Resultados reales.</h2>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:0 }}>
            {[
              { num:'01', label:'EVALÚA', color: t.accent, title:'Auditoría automática', desc:'Performance + SEO + Presencia en segundos. Sin configuración, sin esperas.' },
              { num:'02', label:'DESCUBRE', color: t.accent2, title:'Inteligencia competitiva', desc:'Mapea tu mercado y encuentra oportunidades que tu competencia no está aprovechando.' },
              { num:'03', label:'ALCANZA', color: t.accent3, title:'Outreach con IA', desc:'Convierte oportunidades en clientes con mensajes personalizados generados por IA.' },
            ].map((item, i) => (
              <div key={i} style={{
                padding:'40px 36px',
                borderRight: i < 2 ? `1px solid ${t.border}` : 'none',
                position:'relative',
              }}>
                <div style={{ display:'flex', alignItems:'baseline', gap:12, marginBottom:20 }}>
                  <span style={{ fontFamily:'Syne', fontWeight:800, fontSize:13, color: item.color, letterSpacing:'0.12em' }}>{item.num} ·</span>
                  <span style={{ fontFamily:'Syne', fontWeight:800, fontSize:13, color: item.color, letterSpacing:'0.12em' }}>{item.label}</span>
                </div>
                <h3 style={{ fontFamily:'Syne', fontWeight:800, fontSize:22, color:t.txt, marginBottom:12, letterSpacing:'-0.5px' }}>{item.title}</h3>
                <p style={{ color:t.txtMuted, lineHeight:1.65, fontSize:15 }}>{item.desc}</p>
                {/* Accent line */}
                <div style={{ position:'absolute', bottom:0, left:36, width:40, height:2, background:item.color, borderRadius:1 }} />
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ─── MÉTRICAS DE IMPACTO ─── */}
      <section ref={metricsRef} style={{ background:t.bg, padding:'96px 24px', borderTop:`1px solid ${t.borderSoft}` }}>
        <div style={{ maxWidth:1120, margin:'0 auto' }}>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:0 }}>
            {[
              { value:'40+', label:'Factores SEO analizados', color:t.accent },
              { value:'<30s', label:'Tiempo de resultado', color:t.accent2 },
              { value:'CWV', label:'Core Web Vitals nativos', color:t.accent3 },
              { value:'AI', label:'Impulsado por Claude', color:t.accent },
            ].map((item, i) => (
              <div key={i} style={{
                textAlign:'center', padding:'40px 20px',
                borderRight: i < 3 ? `1px solid ${t.border}` : 'none',
                opacity: metricsInView ? 1 : 0,
                transform: metricsInView ? 'translateY(0)' : 'translateY(20px)',
                transition: `all 0.6s ${i * 0.12}s ease`,
              }}>
                <div style={{ fontFamily:'Syne', fontWeight:800, fontSize:'clamp(32px,4vw,56px)', letterSpacing:'-2px', color:item.color, marginBottom:8 }}>{item.value}</div>
                <div style={{ color:t.txtMuted, fontSize:14 }}>{item.label}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ─── FOOTER CTA ─── */}
      <section style={{
        background:`linear-gradient(135deg, ${t.bg2} 0%, ${t.bg} 100%)`,
        padding:'120px 24px',
        borderTop:`1px solid ${t.borderSoft}`,
        textAlign:'center',
        position:'relative', overflow:'hidden',
      }}>
        {/* Background icon */}
        <img src="logo_eda_sin_background.png" alt="" style={{
          position:'absolute', left:'50%', top:'50%', transform:'translate(-50%,-50%)',
          width:480, height:480, objectFit:'contain',
          opacity: tweaks.darkMode ? 0.03 : 0.04, pointerEvents:'none',
          filter: tweaks.darkMode ? 'none' : 'brightness(0)',
        }} />
        <div style={{ position:'relative', zIndex:1 }}>
          <h2 style={{ fontFamily:'Syne', fontWeight:800, fontSize:'clamp(32px,5vw,64px)', letterSpacing:'-2px', color:t.txt, marginBottom:16 }}>
            Audita tu sitio.<br />
            <span style={{ color:t.accent }}>Es gratis.</span>
          </h2>
          <p style={{ color:t.txtMuted, fontSize:16, marginBottom:40 }}>Sin tarjeta de crédito. Resultado en 30 segundos.</p>
          <div style={{ display:'flex', gap:12, justifyContent:'center', flexWrap:'wrap' }}>
            <button
              onClick={() => window.scrollTo({ top: 0, behavior:'smooth' })}
              style={{
                background: t.accent, color:'#fff', border:'none',
                padding:'16px 36px', borderRadius:10, fontSize:16, fontWeight:700,
                cursor:'pointer', fontFamily:'DM Sans',
                boxShadow:`0 4px 32px ${t.accentGlow}`,
                transition:'all 0.15s',
              }}
              onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-2px)'}
              onMouseLeave={e => e.currentTarget.style.transform = 'translateY(0)'}
            >Auditar mi sitio →</button>
            <button style={{
              background:'transparent', border:`1px solid ${t.border}`, color:t.txt,
              padding:'16px 36px', borderRadius:10, fontSize:16, fontWeight:600,
              cursor:'pointer', fontFamily:'DM Sans', transition:'all 0.15s',
            }}
            onMouseEnter={e => { e.currentTarget.style.background = t.bg3; }}
            onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; }}
            >Ver demo</button>
          </div>
        </div>
      </section>

      {/* ─── FOOTER BAR ─── */}
      <footer style={{ background:t.bg, borderTop:`1px solid ${t.borderSoft}`, padding:'24px', }}>
        <div style={{ maxWidth:1120, margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:16 }}>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <img src="logo_eda_sin_background.png" alt="EDA" style={{ height:22, objectFit:'contain', filter: tweaks.darkMode ? 'none' : 'brightness(0)' }} />
            <img src="eda.png" alt="EDA" style={{ height:16, objectFit:'contain', filter: tweaks.darkMode ? 'brightness(0) invert(1)' : 'brightness(0)' }} />
          </div>
          <span style={{ color:t.txtFaint, fontSize:13 }}>© 2025 EDA · Evalúa. Descubre. Alcanza.</span>
          <div style={{ display:'flex', gap:20 }}>
            {['Privacidad','Términos','Contacto'].map(l => (
              <a key={l} href="#" style={{ color:t.txtFaint, fontSize:13, textDecoration:'none', transition:'color 0.15s' }}
              onMouseEnter={e => e.target.style.color = t.txtMuted}
              onMouseLeave={e => e.target.style.color = t.txtFaint}
              >{l}</a>
            ))}
          </div>
        </div>
      </footer>

      {/* ─── TWEAKS PANEL ─── */}
      <TweaksPanel>
        <TweakSection label="Apariencia">
          <TweakToggle id="darkMode" label="Modo oscuro" />
          <TweakColor id="accentColor" label="Color acento" />
        </TweakSection>
        <TweakSection label="Funciones">
          <TweakToggle id="showScanOverlay" label="Overlay de escaneo" />
        </TweakSection>
      </TweaksPanel>

      <style>{`
        @keyframes radarPulse {
          0%   { transform: scale(0.4); opacity: 0.9; }
          100% { transform: scale(2.2); opacity: 0; }
        }
        @keyframes scanLine {
          0%   { top: 0%; }
          100% { top: 100%; }
        }
        @keyframes spin {
          from { transform: translate(-50%,-50%) rotate(0deg); }
          to   { transform: translate(-50%,-50%) rotate(360deg); }
        }
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(32px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatIcon {
          0%, 100% { transform: translateY(-50%) rotate(-3deg); }
          50%       { transform: translateY(calc(-50% - 18px)) rotate(3deg); }
        }
        input::placeholder { color: #445544; }
      `}</style>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
