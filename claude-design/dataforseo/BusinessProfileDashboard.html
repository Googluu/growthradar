    .leaflet-popup-close-button { color: rgba(255,255,255,0.5) !important; }

    .eda-marker {

      transform: rotate(-45deg);

// ─────────────────────────────────────────────────────────────────────────────
// Icons
// ─────────────────────────────────────────────────────────────────────────────
const Icon = ({ size = 16, sw = 1.6, fill = 'none', children, style }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
       strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, ...style }}>
    {children}
  </svg>
);
const IconCheck       = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 9.5"/></Icon>;
const IconXCircle     = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></Icon>;
const IconAlert       = (p) => <Icon {...p}><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Icon>;
const IconStar        = (p) => <Icon {...p} fill="currentColor" sw={0}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></Icon>;
const IconStarHalf    = (p) => <Icon {...p} fill="none"><path d="M12 2v15.77L5.82 21.02 7 14.14 2 9.27l6.91-1.01L12 2z" fill="currentColor"/><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77"/></Icon>;
const IconStarOutline = (p) => <Icon {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></Icon>;
const IconExternal    = (p) => <Icon {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></Icon>;
const IconPhone       = (p) => <Icon {...p}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></Icon>;
const IconGlobe       = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></Icon>;
const IconCalendar    = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Icon>;
const IconPin         = (p) => <Icon {...p}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></Icon>;
const IconCamera      = (p) => <Icon {...p}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></Icon>;
const IconBadge       = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;

// Category-emoji helper for attribute groups
const ATTR_GROUP_META = {

  'Comodidades':          { color: C.purple, emoji: '☕' },

// ─────────────────────────────────────────────────────────────────────────────
// Primitives
// ─────────────────────────────────────────────────────────────────────────────
function Card({ children, style, ...rest }) {
  return (
    <div style={{
      background: C.card,
      border: `1px solid ${C.border}`,
      borderRadius: 16,
      ...style,
    }} {...rest}>{children}</div>
  );
}

function Badge({ children, color, bg, style }) {
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5,
      background: bg || `${color}15`, color,
      border: `1px solid ${color}40`,
      fontSize: 11, fontWeight: 600,
      padding: '3px 9px', borderRadius: 999,
      letterSpacing: '0.01em', whiteSpace: 'nowrap',
      ...style,
    }}>{children}</span>
  );
}

function SectionTitle({ kicker, title, sub, right }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 18, gap: 16, flexWrap: 'wrap' }}>
      <div>
        {kicker && <div style={{ fontFamily: 'Caveat, cursive', color: C.green, fontSize: 17, marginBottom: 4 }}>{kicker}</div>}
        <h3 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 18, color: C.text, letterSpacing: '-0.01em' }}>{title}</h3>
        {sub && <p style={{ fontSize: 12.5, color: C.text3, marginTop: 4 }}>{sub}</p>}
      </div>
      {right}
    </div>
  );
}

// Stars row (with halves)
function Stars({ value, size = 14, gap = 2 }) {
  const stars = [];
  for (let i = 0; i < 5; i++) {
    const diff = value - i;
    let SC;
    let color = C.yellow;
    if (diff >= 1) SC = IconStar;
    else if (diff >= 0.5) SC = IconStarHalf;
    else { SC = IconStarOutline; color = C.text4; }
    stars.push(<span key={i} style={{ color, display: 'inline-flex' }}><SC size={size}/></span>);
  }
  return <span style={{ display: 'inline-flex', gap }}>{stars}</span>;
}

// ─────────────────────────────────────────────────────────────────────────────
// Hero card
// ─────────────────────────────────────────────────────────────────────────────
function PlaceholderImage({ name, height = 220 }) {
  // Procedurally generated hero image when main_image_url is null
  const initial = (name || '?').trim().charAt(0).toUpperCase();
  return (
    <div style={{
      width: '100%', height,
      background: `
        radial-gradient(circle at 30% 30%, rgba(34,197,94,0.35), transparent 55%),
        radial-gradient(circle at 70% 70%, rgba(251,191,36,0.25), transparent 55%),
        repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 14px),
        linear-gradient(135deg, #1a1a1a, #0d0d0d)
      `,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      position: 'relative', overflow: 'hidden',
    }}>
      <div style={{
        position: 'absolute', inset: 0,
        background: 'radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.6) 100%)',
      }}/>
      <div style={{
        position: 'relative',
        fontFamily: 'Syne, sans-serif', fontWeight: 800,
        fontSize: 80, color: 'rgba(255,255,255,0.18)',
        letterSpacing: '-0.04em',
      }}>{initial}</div>
      <div style={{
        position: 'absolute', bottom: 10, right: 12,
        fontSize: 10.5, color: C.text3,
        fontFamily: 'Inter', fontWeight: 500,
        letterSpacing: '0.06em', textTransform: 'uppercase',
        background: 'rgba(0,0,0,0.5)', padding: '3px 8px', borderRadius: 6,
        backdropFilter: 'blur(4px)',
      }}>Sin foto principal</div>
    </div>
  );
}

function HeroCard({ data }) {
  const { name, original_name, is_renamed, description, category, status, reviews, media, check_url, contact } = data;
  const price = status.price_level ? PRICE_LEVEL_MAP[status.price_level] : null;

  return (
    <Card style={{ padding: 0, overflow: 'hidden' }}>
      <div className="hero-grid" style={{
        display: 'grid', gridTemplateColumns: '380px 1fr', gap: 0,
      }}>
        {/* Image + logo overlay */}
        <div style={{ position: 'relative' }}>
          {media.main_image_url ? (
            <img src={media.main_image_url} alt="" style={{ width: '100%', height: '100%', minHeight: 240, objectFit: 'cover' }}/>
          ) : (
            <PlaceholderImage name={name} height={240}/>
          )}

          {/* Logo bottom-left */}
          <div style={{
            position: 'absolute', bottom: 16, left: 16,
            width: 64, height: 64, borderRadius: 14,
            background: media.logo_url ? '#fff' : 'rgba(20,20,20,0.85)',
            border: `2px solid ${media.logo_url ? '#fff' : 'rgba(255,255,255,0.18)'}`,
            backdropFilter: 'blur(8px)',
            boxShadow: '0 6px 18px rgba(0,0,0,0.5)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            overflow: 'hidden',
          }}>
            {media.logo_url ? (
              <img src={media.logo_url} style={{ width: '100%', height: '100%', objectFit: 'cover' }}/>
            ) : (
              <span style={{
                fontFamily: 'Syne, sans-serif', fontWeight: 800,
                fontSize: 26, color: C.green, letterSpacing: '-0.04em',
              }}>{(name || '?').trim().charAt(0).toUpperCase()}</span>
            )}
          </div>

          {/* Photo count chip */}
          <div style={{
            position: 'absolute', top: 14, left: 14,
            background: 'rgba(0,0,0,0.65)', backdropFilter: 'blur(8px)',
            border: `1px solid rgba(255,255,255,0.12)`,
            padding: '5px 10px', borderRadius: 999,
            display: 'inline-flex', alignItems: 'center', gap: 6,
            color: '#fff', fontSize: 11.5, fontWeight: 500,
            fontFamily: 'Inter',
          }}>
            <IconCamera size={12}/>
            <span style={{ fontFamily: 'JetBrains Mono, monospace' }}>{media.total_photos}</span> fotos
          </div>

          {/* Claimed indicator */}
          {status.is_claimed && (
            <div style={{
              position: 'absolute', top: 14, right: 14,
              background: C.greenSoft, backdropFilter: 'blur(8px)',
              border: `1px solid ${C.greenBorder}`,
              padding: '5px 10px', borderRadius: 999,
              display: 'inline-flex', alignItems: 'center', gap: 6,
              color: C.green, fontSize: 11.5, fontWeight: 600,
            }}>
              <IconShield size={11}/> Verificado
            </div>
          )}
        </div>

        {/* Info */}
        <div style={{
          padding: '28px 32px 24px',
          display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
          gap: 18, minWidth: 0,
        }}>
          <div>

function RadialMini({ score, size = 160 }) {
  const color = scoreColor(score);
  const stroke = 14;
  const r = (size - stroke) / 2;
  const cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  const sweep = 270;
  const arcLen = (sweep / 360) * circ;
  const off = (1 - score / 100) * arcLen;

  return (
    <div style={{ position: 'relative', width: size, height: size, margin: '0 auto' }}>
      <div style={{
        position: 'absolute', inset: -10,
        background: `radial-gradient(circle, ${color}22, transparent 65%)`,
        pointerEvents: 'none', borderRadius: '50%',
      }}/>
      <svg width={size} height={size} style={{ transform: 'rotate(135deg)', display: 'block', position: 'relative' }}>
        <circle cx={cx} cy={cy} r={r} fill="none"
          stroke="rgba(255,255,255,0.06)" strokeWidth={stroke}
          strokeDasharray={`${arcLen} ${circ}`} strokeLinecap="round"/>
        <circle cx={cx} cy={cy} r={r} fill="none"
          stroke={color} strokeWidth={stroke}
          strokeDasharray={`${arcLen} ${circ}`}
          strokeDashoffset={off}
          strokeLinecap="round"
          style={{
            filter: `drop-shadow(0 0 6px ${color}66)`,
            transition: 'stroke-dashoffset 0.8s cubic-bezier(0.2, 0.9, 0.3, 1)',
          }}/>
      </svg>
      <div style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
        pointerEvents: 'none',
      }}>
        <div style={{
          fontFamily: 'Syne, sans-serif', fontWeight: 800,
          fontSize: 44, color, lineHeight: 1, letterSpacing: '-0.03em',
          fontVariantNumeric: 'tabular-nums',
        }}>{score}</div>
        <div style={{ fontSize: 11, color: C.text3, fontWeight: 500, marginTop: 4 }}>/ 100</div>
        <div style={{
          fontSize: 10, color, fontWeight: 700,
          marginTop: 6, letterSpacing: '0.07em', textTransform: 'uppercase',
          padding: '3px 8px', background: `${color}18`,
          border: `1px solid ${color}40`, borderRadius: 999,
        }}>{scoreLabel(score)}</div>
      </div>
    </div>
  );
}

function PlaceTopicsCard({ topics, onTopicClick }) {
  if (!topics || topics.length === 0) return null;
  const maxMentions = Math.max(...topics.map(t => t.mentions));
  const minMentions = Math.min(...topics.map(t => t.mentions));
  const range = Math.max(1, maxMentions - minMentions);

  // Scale font from 12px to 24px
  const fontFor = (m) => 12 + ((m - minMentions) / range) * 12;
  const opacityFor = (m) => 0.55 + ((m - minMentions) / range) * 0.45;

  return (
    <Card style={{ padding: 24, height: '100%', display: 'flex', flexDirection: 'column' }}>
      <SectionTitle
        kicker="Voz del cliente"
        title="Lo que dicen tus clientes"
        sub="Temas más mencionados en reseñas"
        right={<Badge color={C.green}>{topics.reduce((s, t) => s + t.mentions, 0)} menciones</Badge>}
      />

      <div style={{
        display: 'flex', flexWrap: 'wrap', gap: 8,
        alignItems: 'center', justifyContent: 'center',
        flex: 1, padding: '12px 0',
      }}>
        {topics.map(t => {
          const size = fontFor(t.mentions);
          const op = opacityFor(t.mentions);
          return (
            <button key={t.topic}
              onClick={() => onTopicClick?.(t.topic)}
              style={{
                display: 'inline-flex', alignItems: 'baseline', gap: 6,
                padding: `${5 + size * 0.15}px ${10 + size * 0.3}px`,
                background: `rgba(34,197,94,${0.08 + op * 0.1})`,
                border: `1px solid rgba(34,197,94,${0.2 + op * 0.3})`,
                borderRadius: 999, cursor: 'pointer',
                fontSize: size, fontFamily: 'Inter', fontWeight: 600,
                color: `rgba(255,255,255,${op})`,
                transition: 'all 0.15s',
                opacity: op,
              }}
              onMouseEnter={e => {
                e.currentTarget.style.background = `rgba(34,197,94,0.25)`;
                e.currentTarget.style.borderColor = C.green;
                e.currentTarget.style.color = C.text;
                e.currentTarget.style.opacity = '1';
              }}
              onMouseLeave={e => {
                e.currentTarget.style.background = `rgba(34,197,94,${0.08 + op * 0.1})`;
                e.currentTarget.style.borderColor = `rgba(34,197,94,${0.2 + op * 0.3})`;
                e.currentTarget.style.color = `rgba(255,255,255,${op})`;
                e.currentTarget.style.opacity = String(op);
              }}>
              {t.topic}
              <span style={{
                fontFamily: 'JetBrains Mono, monospace',
                fontSize: Math.max(10, size * 0.6),
                color: C.green, opacity: 0.8,
                fontWeight: 700,
              }}>{t.mentions}</span>
            </button>
          );
        })}
      </div>

      <div style={{
        marginTop: 14, padding: '10px 14px', borderRadius: 9,
        background: 'rgba(34,197,94,0.04)',
        border: `1px solid rgba(34,197,94,0.15)`,
        display: 'flex', alignItems: 'center', gap: 8,
        fontSize: 12, color: C.text2,
      }}>
        <IconInfo size={13} style={{ color: C.green, flexShrink: 0 }}/>
        El tamaño y opacidad indican frecuencia de mención. Clic para filtrar reseñas.
      </div>
    </Card>
  );
}

function RatingDistributionCard({ reviews }) {
  const colors = { '5': C.green, '4': C.lime, '3': C.amber, '2': C.orange, '1': C.red };
  const dist = reviews.rating_distribution;
  const pct = reviews.rating_distribution_pct;
  const total = reviews.rating.votes_count;
  const positive = (dist['5'] || 0) + (dist['4'] || 0);
  const negative = (dist['1'] || 0) + (dist['2'] || 0);

  return (
    <Card style={{ padding: 24 }}>
      <SectionTitle
        title="Distribución de calificaciones"
        sub={`Promedio ${reviews.rating.value.toFixed(1)} · ${total.toLocaleString('es-CO')} reseñas`}
        right={
          <div style={{ display: 'flex', gap: 8 }}>
            <Badge color={C.green}>{Math.round((positive / total) * 100)}% positivas</Badge>
            <Badge color={C.red}>{Math.round((negative / total) * 100)}% negativas</Badge>
          </div>
        }
      />

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {['5', '4', '3', '2', '1'].map(star => {
          const p = pct[star] || 0;
          const count = dist[star] || 0;
          return (
            <div key={star} className="rating-row" style={{
              display: 'grid', gridTemplateColumns: '90px 1fr 80px',
              alignItems: 'center', gap: 12,
            }}>
              <div style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                <span style={{
                  fontFamily: 'Syne', fontWeight: 700, fontSize: 14,
                  color: C.text, fontVariantNumeric: 'tabular-nums',
                  width: 14, textAlign: 'right',
                }}>{star}</span>
                <span style={{ color: colors[star] }}><IconStar size={13}/></span>
              </div>
              <div style={{
                position: 'relative',
                background: 'rgba(255,255,255,0.04)',
                borderRadius: 8, height: 22, overflow: 'hidden',
                border: '1px solid rgba(255,255,255,0.04)',
              }}>
                <div style={{
                  width: `${p}%`, height: '100%',
                  background: `linear-gradient(90deg, ${colors[star]}, ${colors[star]}cc)`,
                  borderRadius: 7,
                  boxShadow: `0 0 12px ${colors[star]}40`,
                  transition: 'width 0.6s cubic-bezier(0.2, 0.9, 0.3, 1)',
                }}/>
                {p > 8 && (
                  <span style={{
                    position: 'absolute', left: 10, top: '50%',
                    transform: 'translateY(-50%)',
                    fontSize: 10.5, fontFamily: 'JetBrains Mono, monospace',
                    fontWeight: 700, color: '#0a0a0a',
                  }}>{p.toFixed(1)}%</span>
                )}
              </div>
              <div style={{ textAlign: 'right' }}>
                <span style={{
                  fontFamily: 'JetBrains Mono, monospace', fontSize: 13,
                  color: C.text, fontWeight: 600,
                }}>{count.toLocaleString('es-CO')}</span>
              </div>
            </div>
          );
        })}
      </div>
    </Card>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Map card (Leaflet)
// ─────────────────────────────────────────────────────────────────────────────
function MapCard({ location, name, checkUrl }) {
  const mapDivRef = useRef(null);
  const mapRef = useRef(null);

  useEffect(() => {
    if (!mapDivRef.current || !window.L || mapRef.current) return;
    const L = window.L;
    const m = L.map(mapDivRef.current, {
      center: [location.latitude, location.longitude],
      zoom: 15,
      zoomControl: true,
      attributionControl: true,
      scrollWheelZoom: false,
    });
    mapRef.current = m;

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '© OpenStreetMap, © CARTO',
    }).addTo(m);

    const icon = L.divIcon({
      className: '',
      html: '<div class="eda-marker"></div>',
      iconSize: [36, 36],
      iconAnchor: [18, 36],
    });

    const marker = L.marker([location.latitude, location.longitude], { icon }).addTo(m);
    marker.bindPopup(`
      <div style="font-family: Inter, sans-serif;">
        <div style="font-family: Syne, sans-serif; font-weight: 700; font-size: 14px; color: #fff; margin-bottom: 4px;">${name}</div>
        <div style="font-size: 12px; color: rgba(255,255,255,0.65); margin-bottom: 8px;">${location.address}</div>
        <a href="${checkUrl}" target="_blank" style="color: #22c55e; font-size: 12px; font-weight: 600; text-decoration: none;">
          Abrir en Google Maps →
        </a>
      </div>
    `);

    return () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
  }, [location.latitude, location.longitude, name, location.address, checkUrl]);

  return (
    <Card style={{ padding: 0, overflow: 'hidden' }}>
      <div style={{ padding: '18px 22px', borderBottom: `1px solid ${C.border}` }}>
        <SectionTitle
          title="Ubicación"
          sub={`${location.address}${location.city ? ` · ${location.city}` : ''}`}
          right={
            <a href={checkUrl} target="_blank" rel="noreferrer" style={{
              display: 'inline-flex', alignItems: 'center', gap: 6,
              background: 'rgba(255,255,255,0.04)',
              border: `1px solid ${C.border}`,
              color: C.text2, fontSize: 12, fontWeight: 500,
              padding: '6px 11px', borderRadius: 8,
              transition: 'all 0.15s',
            }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = C.greenBorder; e.currentTarget.style.color = C.green; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.color = C.text2; }}>
              Maps <IconExternal size={11}/>
            </a>
          }
        />
        <div style={{
          fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: C.text3,
        }}>
          {location.latitude.toFixed(4)}, {location.longitude.toFixed(4)}
        </div>
      </div>
      <div ref={mapDivRef} style={{ height: 320, width: '100%' }}/>
    </Card>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Attributes card
// ─────────────────────────────────────────────────────────────────────────────
function AttributesCard({ attributes }) {
  if (!attributes?.available) return null;
  const groups = Object.entries(attributes.available).filter(([_, v]) => v.length > 0);
  if (groups.length === 0) return null;

  return (
    <Card style={{ padding: 24 }}>
      <SectionTitle
        kicker="Detalles"
        title="Atributos del negocio"
        sub="Lo que Google muestra a clientes sobre tu negocio"
        right={<Badge color={C.green}>{groups.reduce((s, [_, v]) => s + v.length, 0)} atributos</Badge>}
      />
      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16,
      }}>
        {groups.map(([groupName, values]) => {
          const meta = ATTR_GROUP_META[groupName] || { color: C.text2, emoji: '·' };
          return (
            <div key={groupName} style={{
              background: 'rgba(255,255,255,0.02)',
              border: `1px solid ${C.border}`,
              borderRadius: 12, padding: 16,
            }}>
              <div style={{
                display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12,
              }}>
                <span style={{ fontSize: 16 }}>{meta.emoji}</span>
                <span style={{
                  fontSize: 12, color: C.text2, fontWeight: 600,
                  letterSpacing: '0.04em', textTransform: 'uppercase',
                }}>{groupName}</span>
                <span style={{
                  fontFamily: 'JetBrains Mono, monospace', fontSize: 11,
                  color: C.text3, marginLeft: 'auto', fontWeight: 600,
                }}>{values.length}</span>
              </div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                {values.map(attr => (
                  <span key={attr} style={{
                    display: 'inline-flex', alignItems: 'center', gap: 4,
                    padding: '5px 10px', borderRadius: 999,
                    background: `${meta.color}10`,
                    border: `1px solid ${meta.color}30`,
                    fontSize: 12, color: C.text, fontWeight: 500,
                  }}>
                    <IconCheck size={10} style={{ color: meta.color }}/>
                    {attr}
                  </span>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </Card>
  );
}

function App() {
  // Variant switcher - lets us preview alert states
  const [variant, setVariant] = useState('default');

  const data = useMemo(() => {
    const d = JSON.parse(JSON.stringify(sampleData));
    if (variant === 'unclaimed') {
      d.status.is_claimed = false;
    } else if (variant === 'closed_temp') {
      d.status.operating_status = 'closed_temporarily';
    } else if (variant === 'closed_perm') {
      d.status.operating_status = 'closed_permanently';
      d.status.is_claimed = false;
    } else if (variant === 'pristine') {
      d.is_renamed = false;
      d.original_name = null;
    }
    return d;
  }, [variant]);

  return (
    <div style={{ minHeight: '100vh', padding: '40px 32px 60px', background: '#0a0a0a' }}>

      }}/>

      <div style={{ maxWidth: 1280, margin: '0 auto', position: 'relative', zIndex: 1 }}>
        {/* Top bar */}
        <div style={{
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          marginBottom: 32, paddingBottom: 18,
          borderBottom: `1px solid ${C.border}`,
          flexWrap: 'wrap', gap: 16,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{
              width: 28, height: 28, borderRadius: 8, background: C.green,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontFamily: 'Syne', fontWeight: 800, color: C.bg, fontSize: 14,
            }}>E</div>
            <div style={{ fontFamily: 'Syne', fontWeight: 700, fontSize: 16, color: C.text }}>EDA</div>
            <div style={{
              fontSize: 12, color: C.text3,
              padding: '2px 8px', borderRadius: 999,
              border: `1px solid ${C.border}`, marginLeft: 8,
            }}>Business Profile</div>
          </div>

          <div style={{
            display: 'flex', gap: 4, padding: 4,
            background: 'rgba(255,255,255,0.04)',
            border: `1px solid ${C.border}`,
            borderRadius: 10,
          }}>
            {[
              { v: 'default',     l: 'Renombrado' },
              { v: 'pristine',    l: 'Sin alertas' },
              { v: 'unclaimed',   l: 'Sin reclamar' },
              { v: 'closed_temp', l: 'Cerrado temp.' },

              <button key={opt.v} onClick={() => setVariant(opt.v)} style={{

            ))}
