<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }

    @keyframes pulse-soft { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes growIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    @media (max-width: 1100px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .three-grid { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 700px) {
      .kpi-grid { grid-template-columns: 1fr !important; }
      .filter-bar { flex-wrap: wrap; }
      .keywords-table th:nth-child(4), .keywords-table td:nth-child(4),
      .keywords-table th:nth-child(5), .keywords-table td:nth-child(5),
      .keywords-table th:nth-child(6), .keywords-table td:nth-child(6) { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

// ─────────────────────────────────────────────────────────────────────────────
// Design tokens
// ─────────────────────────────────────────────────────────────────────────────
const C = {
  bg: '#0a0a0a',
  bg2: '#111',
  card: 'rgba(255,255,255,0.025)',
  cardHover: 'rgba(255,255,255,0.045)',
  border: 'rgba(255,255,255,0.07)',
  borderStrong: 'rgba(255,255,255,0.14)',
  text: '#fff',
  text2: 'rgba(255,255,255,0.65)',
  text3: 'rgba(255,255,255,0.45)',
  text4: 'rgba(255,255,255,0.28)',
  green: '#22c55e',
  greenSoft: 'rgba(34,197,94,0.15)',
  greenBorder: 'rgba(34,197,94,0.35)',
  yellow: '#fbbf24',
  orange: '#fb923c',
  red: '#ef4444',
  blue: '#60a5fa',
  purple: '#a78bfa',
  pink: '#f472b6',
};

// Difficulty color scale 0..100
const diffColor = (n) => {
  if (n == null) return C.text4;
  if (n < 30) return C.green;
  if (n < 50) return C.yellow;
  if (n < 70) return C.orange;
  return C.red;
};

// ─────────────────────────────────────────────────────────────────────────────
// Sample data (LabsData)
// ─────────────────────────────────────────────────────────────────────────────
const CATEGORY_NAMES = {
  10026: 'Comida y bebida',
  10142: 'Restaurantes',
  12345: 'Pizza y pasta',
  10567: 'Entrega a domicilio',
  10089: 'Gastronomía local',
  10215: 'Reseñas y guías',
};

const INTENT_META = {
  informational: { label: 'Informacional', icon: '💡', color: C.blue },
  commercial:    { label: 'Comercial',     icon: '💰', color: C.yellow },
  navigational:  { label: 'Navegacional',  icon: '🔍', color: C.purple },
  transactional: { label: 'Transaccional', icon: '🛒', color: C.green },
};

// Helper: generate plausible monthly sparkline
const makeMonths = (base, vol = 0.25) => {
  const out = [];
  const start = new Date(2025, 4); // May 2025
  for (let i = 0; i < 12; i++) {
    const d = new Date(start);
    d.setMonth(d.getMonth() + i);
    const seasonal = 1 + Math.sin((i + 5) / 12 * Math.PI * 2) * vol;
    const noise = 0.85 + Math.random() * 0.3;
    out.push({ year: d.getFullYear(), month: d.getMonth() + 1, search_volume: Math.round(base * seasonal * noise) });
  }
  return out;
};

const KEYWORDS_RAW = [
  ['pizza a domicilio bogotá',           1, 49500,  'HIGH',   1.42, 71, 'transactional', [10567, 10142, 12345], ['pizza domicilio chapinero', 'pizza domicilio usaquén', 'pizza barata domicilio']],
  ['mejor pizzería en bogotá',           1, 33100,  'MEDIUM', 0.89, 58, 'commercial',    [10142, 10215],         ['mejor pizza chapinero', 'mejores pizzerías 2026']],
  ['pizzería artesanal bogotá',          1, 12100,  'LOW',    0.62, 28, 'commercial',    [10142, 12345],         ['pizza masa madre bogotá', 'horno de leña bogotá']],
  ['pizza napolitana bogotá',            2,  9900,  'LOW',    0.71, 24, 'commercial',    [12345, 10089],         ['donde comer pizza napolitana', 'pizza italiana bogotá']],
  ['pizza chapinero',                    2,  8100,  'MEDIUM', 0.95, 41, 'commercial',    [10567, 10142],         ['pizzerías chapinero alto', 'pizza t-zone']],
  ['pizza usaquén',                      2,  6600,  'LOW',    0.83, 22, 'commercial',    [10567, 10142],         ['pizzería usaquén domicilio']],
  ['pizza zona t',                       2,  5400,  'MEDIUM', 1.12, 38, 'commercial',    [10567, 10142],         []],
  ['pizza masa madre',                   2,  4400,  'LOW',    0.45, 19, 'informational', [12345, 10089],         ['masa madre fermentación']],
  ['como hacer pizza casera',            3,  3600,  'LOW',    0.21, 12, 'informational', [10026, 12345],         ['receta de masa de pizza']],
  ['promociones pizza bogotá',           1, 14800,  'HIGH',   1.65, 64, 'transactional', [10567, 10142],         ['2x1 pizza bogotá', 'descuentos pizza']],
  ['pizza barata bogotá',                2, 18100,  'HIGH',   1.31, 67, 'transactional', [10567, 10142],         []],
  ['pizza vegana bogotá',                2,  2900,  'LOW',    0.51, 21, 'commercial',    [10142, 10089],         ['pizza sin queso bogotá']],
  ['pizza familiar bogotá',              2,  4900,  'MEDIUM', 1.08, 44, 'transactional', [10567],                []],
  ['pizza al corte bogotá',              3,  1900,  'LOW',    0.39, 17, 'commercial',    [12345],                []],
  ['pizza 24 horas bogotá',              2,  3200,  'MEDIUM', 1.22, 49, 'transactional', [10567],                ['pizza madrugada bogotá']],
  ['pizza receta italiana',              3,  6600,  'LOW',    0.28, 14, 'informational', [10026],                []],
  ['historia de la pizza',               4,  8100,  'LOW',    0.18, 9,  'informational', [10026],                []],
  ['don mario pizzería',                 1,  1300,  'LOW',    0.34, 8,  'navigational',  [10142],                ['don mario chapinero menu']],
  ['rappi pizza bogotá',                 2,  5400,  'MEDIUM', 1.45, 52, 'navigational',  [10567],                []],
  ['domicilios pizza',                   1, 22200,  'HIGH',   1.55, 73, 'transactional', [10567],                ['app pizza domicilio']],
];

const KEYWORDS = KEYWORDS_RAW.map(([keyword, depth, vol, comp, cpc, kd, intent, cats, subs], i) => ({
  keyword,
  depth,
  search_volume: vol,
  competition_level: comp,
  cpc,
  keyword_difficulty: kd,
  main_intent: intent,
  monthly_searches: makeMonths(vol),
  serp_features: i % 3 === 0 ? ['ai_overview', 'people_also_ask', 'local_pack'] : i % 3 === 1 ? ['people_also_ask', 'related_searches'] : ['featured_snippet', 'sitelinks'],
  categories: cats,
  related_keywords_sub: subs,
}));

const sampleData = {
  seed_keyword: 'pizza bogotá',
  total_count: 1284,
  items_count: 20,
  total_search_volume: KEYWORDS.reduce((s, k) => s + (k.search_volume || 0), 0),
  avg_cpc: +(KEYWORDS.reduce((s, k) => s + (k.cpc || 0), 0) / KEYWORDS.length).toFixed(2),
  avg_difficulty: Math.round(KEYWORDS.reduce((s, k) => s + (k.keyword_difficulty || 0), 0) / KEYWORDS.length),
  estimated_traffic_value_usd: 18420,
  competition_distribution: { LOW: 9, MEDIUM: 6, HIGH: 5 },
  intent_distribution: { informational: 5, commercial: 7, navigational: 2, transactional: 6 },
  difficulty_buckets: { easy: 8, medium: 5, hard: 5, very_hard: 2 },
  top_categories: [
    { category_id: 10142, count: 11, category_name: 'Restaurantes' },
    { category_id: 10567, count: 9,  category_name: 'Entrega a domicilio' },
    { category_id: 12345, count: 6,  category_name: 'Pizza y pasta' },
    { category_id: 10026, count: 4,  category_name: 'Comida y bebida' },
    { category_id: 10089, count: 3,  category_name: 'Gastronomía local' },
    { category_id: 10215, count: 1,  category_name: 'Reseñas y guías' },
  ],
  monthly_aggregated: (() => {
    // Sum across all keywords month-by-month
    const out = [];
    const months = KEYWORDS[0].monthly_searches.length;
    for (let i = 0; i < months; i++) {
      const ref = KEYWORDS[0].monthly_searches[i];
      const total = KEYWORDS.reduce((s, k) => s + (k.monthly_searches[i]?.search_volume || 0), 0);
      out.push({ year_month: `${ref.year}-${String(ref.month).padStart(2,'0')}`, search_volume: total });
    }
    return out;
  })(),
  top_keywords_by_volume: KEYWORDS.slice().sort((a,b)=>(b.search_volume||0)-(a.search_volume||0)).slice(0,5),
  low_hanging_fruit: KEYWORDS.filter(k => k.keyword_difficulty != null && k.keyword_difficulty < 30 && k.search_volume > 1500).sort((a,b)=>(b.search_volume||0)-(a.search_volume||0)).slice(0, 5),
  keywords: KEYWORDS,
  cost: 0.0182,
  task_time: '4.41s',
};

// ─────────────────────────────────────────────────────────────────────────────
// Inline icons
// ─────────────────────────────────────────────────────────────────────────────
const Icon = ({ size = 16, sw = 1.6, children }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
    {children}
  </svg>
);
const IconTrendUp   = (p) => <Icon {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Icon>;
const IconDollar    = (p) => <Icon {...p}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></Icon>;
const IconGauge     = (p) => <Icon {...p}><path d="M12 14l4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></Icon>;
const IconTraffic   = (p) => <Icon {...p}><path d="M3 3v18h18"/><path d="M7 16l4-6 4 3 5-8"/></Icon>;
const IconSparkle   = (p) => <Icon {...p}><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4L12 3z"/></Icon>;
const IconClock     = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
const IconExternal  = (p) => <Icon {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></Icon>;
const IconChevDown  = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9"/></Icon>;
const IconChevRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"/></Icon>;
const IconArrowUp   = (p) => <Icon {...p}><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></Icon>;
const IconArrowDown = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></Icon>;
const IconFilter    = (p) => <Icon {...p}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></Icon>;
const IconLayers    = (p) => <Icon {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></Icon>;
const IconSearch    = (p) => <Icon {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;

// ─────────────────────────────────────────────────────────────────────────────
// Formatting helpers
// ─────────────────────────────────────────────────────────────────────────────
const fmtCompact = (n) => {
  if (n == null) return '—';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(n >= 10_000_000 ? 0 : 1) + 'M';
  if (n >= 1_000)     return (n / 1_000).toFixed(n >= 10_000 ? 0 : 1) + 'K';
  return String(n);
};
const fmtUsd = (n) => '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
const fmtInt = (n) => n.toLocaleString('es-CO');

// ─────────────────────────────────────────────────────────────────────────────
// Card primitives
// ─────────────────────────────────────────────────────────────────────────────
function Card({ children, style, accent, ...rest }) {
  return (
    <div style={{
      background: accent ? `linear-gradient(180deg, rgba(34,197,94,0.06), ${C.card})` : C.card,
      border: `1px solid ${accent ? C.greenBorder : C.border}`,
      borderRadius: 16,
      ...style,
    }} {...rest}>{children}</div>
  );
}

function Badge({ children, tone = 'default', style }) {
  const tones = {
    default: { bg: 'rgba(255,255,255,0.06)', fg: C.text2, br: 'rgba(255,255,255,0.1)' },
    green:   { bg: C.greenSoft, fg: C.green, br: C.greenBorder },
    yellow:  { bg: 'rgba(251,191,36,0.12)', fg: C.yellow, br: 'rgba(251,191,36,0.3)' },
    orange:  { bg: 'rgba(251,146,60,0.12)', fg: C.orange, br: 'rgba(251,146,60,0.3)' },
    red:     { bg: 'rgba(239,68,68,0.12)', fg: C.red, br: 'rgba(239,68,68,0.3)' },
    blue:    { bg: 'rgba(96,165,250,0.12)', fg: C.blue, br: 'rgba(96,165,250,0.3)' },
    purple:  { bg: 'rgba(167,139,250,0.12)', fg: C.purple, br: 'rgba(167,139,250,0.3)' },
  }[tone] || tones.default;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5,
      background: tones.bg, color: tones.fg,
      border: `1px solid ${tones.br}`,
      fontSize: 11, fontWeight: 600,
      padding: '2px 8px', borderRadius: 999,
      letterSpacing: '0.01em',
      fontFamily: 'Inter',
      whiteSpace: 'nowrap',
      ...style,
    }}>{children}</span>
  );
}

function SectionTitle({ kicker, title, sub, right }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20, gap: 16 }}>
      <div>
        {kicker && <div style={{ fontFamily: 'Caveat, cursive', color: C.green, fontSize: 17, marginBottom: 4 }}>{kicker}</div>}
        <h2 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 22, color: C.text, letterSpacing: '-0.015em' }}>{title}</h2>
        {sub && <p style={{ fontSize: 13, color: C.text3, marginTop: 4 }}>{sub}</p>}
      </div>
      {right}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// KPI Cards
// ─────────────────────────────────────────────────────────────────────────────
function KpiCard({ icon, label, value, sub, accent, footer }) {
  return (
    <Card style={{ padding: '20px 22px', display: 'flex', flexDirection: 'column', gap: 12, minHeight: 148 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <div style={{
          width: 36, height: 36, borderRadius: 10,
          background: accent ? C.greenSoft : 'rgba(255,255,255,0.06)',
          color: accent ? C.green : C.text2,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          border: `1px solid ${accent ? C.greenBorder : C.border}`,
        }}>{icon}</div>
        <div style={{
          fontSize: 10.5, color: C.text3, letterSpacing: '0.07em',
          textTransform: 'uppercase', fontWeight: 600, textAlign: 'right',
        }}>{label}</div>
      </div>
      <div style={{ marginTop: 'auto' }}>
        <div style={{
          fontFamily: 'Syne, sans-serif', fontWeight: 800,
          fontSize: 34, lineHeight: 1,
          color: accent ? C.green : C.text,
          letterSpacing: '-0.02em',
        }}>{value}</div>
        {sub && <div style={{ fontSize: 12, color: C.text3, marginTop: 6 }}>{sub}</div>}
        {footer}
      </div>
    </Card>
  );
}

function KpiRow({ data }) {
  return (
    <div className="kpi-grid" style={{
      display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)',
      gap: 16, marginBottom: 36,
    }}>
      <KpiCard
        icon={<IconTrendUp size={18}/>}
        label="Volumen Total"
        value={fmtCompact(data.total_search_volume)}
        sub={`búsquedas / mes en ${data.items_count} keywords`}
      />
      <KpiCard
        icon={<IconDollar size={18}/>}
        label="CPC Promedio"
        value={fmtUsd(data.avg_cpc)}
        sub="costo por clic en Google Ads"
      />
      <KpiCard
        icon={<IconGauge size={18}/>}
        label="Dificultad Promedio"
        value={`${data.avg_difficulty}`}
        sub={`/ 100 — ${data.avg_difficulty < 30 ? 'fácil' : data.avg_difficulty < 50 ? 'moderada' : data.avg_difficulty < 70 ? 'difícil' : 'muy difícil'}`}
        footer={
          <div style={{
            marginTop: 10, background: 'rgba(255,255,255,0.05)',
            borderRadius: 999, height: 6, overflow: 'hidden',
          }}>
            <div style={{
              width: `${data.avg_difficulty}%`, height: '100%',
              background: `linear-gradient(90deg, ${diffColor(data.avg_difficulty)}cc, ${diffColor(data.avg_difficulty)})`,
              borderRadius: 999,
              transition: 'width 0.6s cubic-bezier(0.2, 0.9, 0.3, 1)',
            }} />
          </div>
        }
      />
      <KpiCard
        icon={<IconTraffic size={18}/>}
        label="Valor de Tráfico"
        value={fmtUsd(data.estimated_traffic_value_usd)}
        sub="estimación mensual en USD"
        accent
      />
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Monthly trend (custom SVG AreaChart)
// ─────────────────────────────────────────────────────────────────────────────
function MonthlyTrend({ data }) {
  const wrapRef = useRef(null);
  const [size, setSize] = useState({ w: 800, h: 240 });
  const [hover, setHover] = useState(null);

  useEffect(() => {
    if (!wrapRef.current) return;
    const ro = new ResizeObserver(() => {
      const r = wrapRef.current.getBoundingClientRect();
      setSize({ w: Math.max(300, r.width), h: 240 });
    });
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);

  const points = data.monthly_aggregated;
  const pad = { l: 50, r: 16, t: 18, b: 36 };
  const cw = size.w, ch = size.h;
  const iw = cw - pad.l - pad.r;
  const ih = ch - pad.t - pad.b;
  const max = Math.max(...points.map(p => p.search_volume)) * 1.15;
  const min = 0;

  const xAt = (i) => pad.l + (i / (points.length - 1)) * iw;
  const yAt = (v) => pad.t + ih - ((v - min) / (max - min)) * ih;

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xAt(i).toFixed(2)} ${yAt(p.search_volume).toFixed(2)}`).join(' ');
  const areaPath = linePath + ` L ${xAt(points.length - 1)} ${pad.t + ih} L ${xAt(0)} ${pad.t + ih} Z`;

  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => min + (max - min) * t);
  const monthShort = (ym) => {
    const [y, m] = ym.split('-');
    return new Date(+y, +m - 1, 1).toLocaleString('es-CO', { month: 'short' });
  };

  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * cw;
    const i = Math.round(((x - pad.l) / iw) * (points.length - 1));
    if (i >= 0 && i < points.length) setHover(i);
    else setHover(null);
  };

  return (
    <Card style={{ padding: 24 }}>
      <SectionTitle
        kicker="Tendencia"
        title="Volumen mensual agregado"
        sub="Suma del volumen de búsqueda de las keywords analizadas, últimos 12 meses"
        right={
          <Badge tone="green" style={{ fontSize: 12, padding: '4px 10px' }}>
            <IconTrendUp size={11}/> {fmtCompact(data.total_search_volume)} / mes
          </Badge>
        }
      />
      <div ref={wrapRef} style={{ width: '100%', position: 'relative' }}>
        <svg width={cw} height={ch} onMouseMove={onMove} onMouseLeave={() => setHover(null)} style={{ display: 'block', cursor: 'crosshair' }}>
          <defs>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={C.green} stopOpacity="0.35"/>
              <stop offset="100%" stopColor={C.green} stopOpacity="0"/>
            </linearGradient>
          </defs>

          {/* Y gridlines + labels */}
          {yTicks.map((t, i) => (
            <g key={i}>
              <line x1={pad.l} x2={cw - pad.r} y1={yAt(t)} y2={yAt(t)}
                stroke="rgba(255,255,255,0.05)" strokeDasharray="2 4"/>

// ─────────────────────────────────────────────────────────────────────────────
// Intent donut (custom SVG PieChart)
// ─────────────────────────────────────────────────────────────────────────────
function IntentDonut({ dist }) {
  const [hover, setHover] = useState(null);
  const entries = Object.entries(dist).map(([k, v]) => ({ key: k, value: v, ...INTENT_META[k] }));
  const total = entries.reduce((s, e) => s + e.value, 0);

  const cx = 90, cy = 90, r = 70, innerR = 46;
  let angle = -Math.PI / 2;

  const arcs = entries.map((e) => {
    const a0 = angle;
    const a1 = angle + (e.value / total) * Math.PI * 2;
    angle = a1;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const x0 = cx + Math.cos(a0) * r, y0 = cy + Math.sin(a0) * r;
    const x1 = cx + Math.cos(a1) * r, y1 = cy + Math.sin(a1) * r;
    const xi0 = cx + Math.cos(a0) * innerR, yi0 = cy + Math.sin(a0) * innerR;
    const xi1 = cx + Math.cos(a1) * innerR, yi1 = cy + Math.sin(a1) * innerR;
    const d = `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${xi1} ${yi1} A ${innerR} ${innerR} 0 ${large} 0 ${xi0} ${yi0} Z`;
    return { ...e, d, a0, a1 };
  });

  const current = hover != null ? entries[hover] : null;
  const centerLabel = current ? current.label : 'Total';
  const centerValue = current ? current.value : total;

  return (
    <Card style={{ padding: 24, height: '100%' }}>
      <SectionTitle title="Intent de búsqueda" sub="Qué quiere el usuario al buscar"/>
      <div style={{ display: 'flex', alignItems: 'center', gap: 20, flexWrap: 'wrap' }}>
        <div style={{ position: 'relative', width: 180, height: 180, flexShrink: 0 }}>
          <svg width="180" height="180" viewBox="0 0 180 180">
            {arcs.map((a, i) => (
              <path key={i} d={a.d} fill={a.color}
                fillOpacity={hover == null || hover === i ? 1 : 0.3}
                stroke={C.bg} strokeWidth="2"
                onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}
                style={{ cursor: 'pointer', transition: 'fill-opacity 0.15s' }}/>
            ))}
          </svg>
          <div style={{
            position: 'absolute', inset: 0,
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            pointerEvents: 'none',
          }}>
            <div style={{ fontSize: 11, color: C.text3, fontWeight: 500, marginBottom: 2 }}>{centerLabel}</div>
            <div style={{ fontFamily: 'Syne', fontWeight: 800, fontSize: 28, color: C.text }}>
              {centerValue}
            </div>
            <div style={{ fontSize: 10.5, color: C.text3 }}>keywords</div>
          </div>
        </div>

        {/* Legend */}
        <div style={{ flex: 1, minWidth: 180, display: 'flex', flexDirection: 'column', gap: 8 }}>
          {entries.map((e, i) => (
            <div key={e.key}
              onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}
              style={{
                display: 'flex', alignItems: 'center', gap: 10,
                padding: '6px 10px', borderRadius: 8,
                background: hover === i ? 'rgba(255,255,255,0.04)' : 'transparent',
                cursor: 'default',
              }}>
              <span style={{ fontSize: 14 }}>{e.icon}</span>
              <span style={{ width: 8, height: 8, borderRadius: 2, background: e.color }}/>
              <span style={{ flex: 1, fontSize: 12.5, color: C.text2, fontWeight: 500 }}>{e.label}</span>
              <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 12, color: C.text, fontWeight: 600 }}>
                {e.value}
              </span>
              <span style={{ fontSize: 10.5, color: C.text3, minWidth: 32, textAlign: 'right' }}>
                {((e.value / total) * 100).toFixed(0)}%

            </div>
          ))}
        </div>
      </div>
    </Card>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Sparkline (mini SVG line)
// ─────────────────────────────────────────────────────────────────────────────
function Sparkline({ data, w = 96, h = 28, color = C.green }) {
  if (!data || !data.length) return null;
  const vs = data.map(d => d.search_volume);
  const max = Math.max(...vs), min = Math.min(...vs);
  const range = max - min || 1;
  const path = vs.map((v, i) => {
    const x = (i / (vs.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ');
  const area = path + ` L ${w} ${h} L 0 ${h} Z`;
  const lastX = w, lastY = h - ((vs[vs.length - 1] - min) / range) * (h - 4) - 2;
  return (
    <svg width={w} height={h} style={{ display: 'block' }}>
      <defs>
        <linearGradient id={`spk-${color}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#spk-${color})`}/>
      <path d={path} stroke={color} strokeWidth="1.5" fill="none" strokeLinejoin="round"/>
      <circle cx={lastX} cy={lastY} r="2" fill={color}/>
    </svg>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Keywords table
// ─────────────────────────────────────────────────────────────────────────────
function KeywordsTable({ keywords, target }) {
  const [sort, setSort] = useState({ key: 'search_volume', dir: 'desc' });
  const [expanded, setExpanded] = useState(new Set());
  const [filters, setFilters] = useState({ intent: [], competition: [], difficulty: [], depth: [] });

  const inDifficulty = (kd, bucket) => {
    if (kd == null) return false;
    if (bucket === 'easy') return kd < 30;
    if (bucket === 'medium') return kd >= 30 && kd < 50;
    if (bucket === 'hard') return kd >= 50 && kd < 70;
    if (bucket === 'very_hard') return kd >= 70;
    return false;
  };

  const filtered = useMemo(() => {
    return keywords.filter(k => {
      if (filters.intent.length && !filters.intent.includes(k.main_intent)) return false;
      if (filters.competition.length && !filters.competition.includes(k.competition_level)) return false;
      if (filters.difficulty.length && !filters.difficulty.some(b => inDifficulty(k.keyword_difficulty, b))) return false;
      if (filters.depth.length && !filters.depth.includes(k.depth)) return false;
      return true;
    });
  }, [keywords, filters]);

  const sorted = useMemo(() => {
    const arr = [...filtered];
    const dir = sort.dir === 'asc' ? 1 : -1;
    arr.sort((a, b) => {
      const va = a[sort.key], vb = b[sort.key];
      if (va == null) return 1;
      if (vb == null) return -1;
      if (typeof va === 'string') return va.localeCompare(vb) * dir;
      return (va - vb) * dir;
    });
    return arr;
  }, [filtered, sort]);

  const toggleSort = (key) => setSort(s => s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'desc' });
  const toggleExpand = (kw) => setExpanded(s => {
    const ns = new Set(s);
    ns.has(kw) ? ns.delete(kw) : ns.add(kw);
    return ns;
  });

  const SortHead = ({ k, children, w, align }) => (
    <th style={{
      textAlign: align || 'left', width: w,
      padding: '14px 16px', fontSize: 10.5,
      fontWeight: 600, color: C.text3,
      letterSpacing: '0.07em', textTransform: 'uppercase',
      borderBottom: `1px solid ${C.border}`,
      cursor: 'pointer', userSelect: 'none', whiteSpace: 'nowrap',
      background: 'rgba(255,255,255,0.02)',
    }} onClick={() => toggleSort(k)}>
      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}>
        {children}
        {sort.key === k && (sort.dir === 'asc' ? <IconArrowUp size={11}/> : <IconArrowDown size={11}/>)}
      </span>
    </th>
  );

  return (
    <div>
      <SectionTitle
        kicker="Keywords"
        title={`${filtered.length} keywords encontradas`}
        sub="Clic en una keyword para ver sus sub-keywords relacionadas"
        right={
          <Badge tone="default" style={{ fontSize: 12, padding: '4px 10px' }}>
            <IconLayers size={11}/> {keywords.length} totales
          </Badge>
        }
      />

      <FilterBar filters={filters} setFilters={setFilters}/>

      <Card style={{ padding: 0, overflow: 'hidden' }}>
        <div style={{ overflowX: 'auto' }}>
          <table className="keywords-table" style={{ width: '100%', borderCollapse: 'collapse', minWidth: 900 }}>
            <thead>
              <tr>
                <SortHead k="keyword" w="auto">Keyword</SortHead>
                <SortHead k="search_volume" w={170}>Volumen</SortHead>
                <SortHead k="keyword_difficulty" w={110} align="center">Dificultad</SortHead>
                <SortHead k="cpc" w={90} align="right">CPC</SortHead>
                <SortHead k="competition_level" w={110} align="center">Competencia</SortHead>
                <SortHead k="main_intent" w={80} align="center">Intent</SortHead>
                <th style={{
                  padding: '14px 16px', fontSize: 10.5, fontWeight: 600,

// ─────────────────────────────────────────────────────────────────────────────
// Treemap (squarified-ish; simple slice & dice)
// ─────────────────────────────────────────────────────────────────────────────
function squarify(values, width, height) {
  // Simple squarified: sort desc, lay rows alternating orientation
  const total = values.reduce((s, v) => s + v.value, 0);
  const items = values.map(v => ({ ...v, area: v.value / total * width * height }));
  items.sort((a, b) => b.area - a.area);

  const result = [];
  let x = 0, y = 0, w = width, h = height;
  let i = 0;
  while (i < items.length) {
    const remaining = items.slice(i);
    // Take row: keep adding until adding worsens aspect ratio
    const horizontal = w >= h;
    const side = horizontal ? h : w;
    let row = [];
    let rowSum = 0;
    const worst = (r, s) => {
      const sum = r.reduce((a, b) => a + b.area, 0);
      const max = Math.max(...r.map(x => x.area));
      const min = Math.min(...r.map(x => x.area));
      const s2 = s * s;
      const sum2 = sum * sum;
      return Math.max((s2 * max) / sum2, sum2 / (s2 * min));
    };
    for (const it of remaining) {
      const candidate = [...row, it];
      if (row.length === 0 || worst(candidate, side) < worst(row, side)) {
        row = candidate;
        rowSum = row.reduce((a, b) => a + b.area, 0);
      } else break;
    }
    // Place row
    const rowThickness = rowSum / side;
    let cursor = horizontal ? y : x;
    for (const it of row) {
      const itLen = it.area / rowThickness;
      result.push({
        ...it,
        x: horizontal ? x : cursor,
        y: horizontal ? cursor : y,
        w: horizontal ? rowThickness : itLen,
        h: horizontal ? itLen : rowThickness,
      });
      cursor += itLen;
    }
    if (horizontal) { x += rowThickness; w -= rowThickness; }
    else { y += rowThickness; h -= rowThickness; }
    i += row.length;
  }
  return result;
}

function CategoriesTreemap({ categories }) {
  const wrapRef = useRef(null);
  const [size, setSize] = useState({ w: 800, h: 320 });

  useEffect(() => {
    if (!wrapRef.current) return;
    const ro = new ResizeObserver(() => {
      const r = wrapRef.current.getBoundingClientRect();
      setSize({ w: Math.max(300, r.width), h: 320 });
    });
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);

  const colors = [C.green, '#4ade80', C.blue, C.purple, C.yellow, C.orange];
  const values = categories.map((c, i) => ({
    label: c.category_name || CATEGORY_NAMES[c.category_id] || `Cat. ${c.category_id}`,
    value: c.count,
    id: c.category_id,
    color: colors[i % colors.length],
  }));

  const rects = useMemo(() => squarify(values, size.w, size.h), [values, size.w, size.h]);
  const total = values.reduce((s, v) => s + v.value, 0);

  return (
    <Card style={{ padding: 24 }}>
      <SectionTitle
        kicker="Categorías"
        title="Top categorías de keywords"
        sub="Distribución temática de las keywords analizadas"
      />
      <div ref={wrapRef} style={{ width: '100%', position: 'relative' }}>
        <svg width={size.w} height={size.h} style={{ display: 'block', borderRadius: 12, overflow: 'hidden' }}>
          {rects.map((r, i) => {
            const pct = (r.value / total) * 100;
            const showLabel = r.w > 70 && r.h > 40;
            return (
              <g key={i}>
                <rect x={r.x + 2} y={r.y + 2} width={r.w - 4} height={r.h - 4} rx={10}
                  fill={r.color} fillOpacity={0.18}
                  stroke={r.color} strokeOpacity={0.4} strokeWidth={1}/>
                {showLabel && (
                  <>
                    <text x={r.x + 14} y={r.y + 26} fontSize="13" fontFamily="Inter"
                      fontWeight="600" fill={C.text}>
                      {r.label}
                    </text>
                    <text x={r.x + 14} y={r.y + 50} fontSize="22" fontFamily="Syne"
                      fontWeight="800" fill={r.color}>
                      {r.value}
                    </text>
                    <text x={r.x + 14} y={r.y + 70} fontSize="11" fontFamily="JetBrains Mono, monospace"
                      fill={C.text3}>
                      {pct.toFixed(0)}% del total
                    </text>
                  </>
                )}
                {!showLabel && r.w > 30 && r.h > 30 && (
                  <text x={r.x + r.w / 2} y={r.y + r.h / 2 + 4} fontSize="13"
                    fontFamily="Syne" fontWeight="700" fill={C.text} textAnchor="middle">
                    {r.value}
                  </text>
                )}
              </g>
            );
          })}
        </svg>
      </div>
    </Card>
  );
}
