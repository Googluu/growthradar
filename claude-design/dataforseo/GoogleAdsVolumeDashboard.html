  <script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

// ─────────────────────────────────────────────────────────────────────────────
// Design tokens
// ─────────────────────────────────────────────────────────────────────────────
const C = {
  bg: '#0a0a0a',
  card: 'rgba(255,255,255,0.025)',
  cardHover: 'rgba(255,255,255,0.045)',
  border: 'rgba(255,255,255,0.07)',
  borderStrong: 'rgba(255,255,255,0.14)',
  text: '#fff',
  text2: 'rgba(255,255,255,0.65)',
  text3: 'rgba(255,255,255,0.45)',
  text4: 'rgba(255,255,255,0.28)',
  green: '#22c55e',
  greenSoft: 'rgba(34,197,94,0.15)',
  greenBorder: 'rgba(34,197,94,0.35)',
  yellow: '#fbbf24',
  orange: '#fb923c',
  red: '#ef4444',
  blue: '#60a5fa',
  purple: '#a78bfa',
  pink: '#f472b6',
};

const COMPETITION_META = {
  LOW:    { label: 'Baja',  tone: 'green',  color: C.green },
  MEDIUM: { label: 'Media', tone: 'yellow', color: C.yellow },
  HIGH:   { label: 'Alta',  tone: 'red',    color: C.red },
};

// Series colors for comparativa
const SERIES_COLORS = [C.green, C.blue, C.purple, C.orange, C.pink, C.yellow, '#34d399', '#fb7185'];

// ─────────────────────────────────────────────────────────────────────────────
// Sample data — pizza delivery in Bogotá universe
// ─────────────────────────────────────────────────────────────────────────────
// Helper: build 12 months of synthetic data ending May 2026
function makeMonths(base, seasonality = 0.25, peakMonth = 11) {
  // peakMonth 0..11 (December = 11 default)
  const out = [];
  const start = new Date(2025, 5, 1); // June 2025
  for (let i = 0; i < 12; i++) {
    const d = new Date(start);
    d.setMonth(start.getMonth() + i);
    const m = d.getMonth(); // 0..11
    // distance from peak (0..6)
    const dist = Math.min(Math.abs(m - peakMonth), 12 - Math.abs(m - peakMonth));
    const seasonalFactor = 1 + seasonality * (1 - dist / 6);
    const noise = 0.92 + (((i * 37 + base) % 13) / 13) * 0.16; // deterministic
    out.push({
      year: d.getFullYear(),
      month: d.getMonth() + 1,
      search_volume: Math.round(base * seasonalFactor * noise),
    });
  }
  return out;
}

const KEYWORDS_DEF = [
  // [keyword, vol, comp, comp_idx, cpc, lowBid, highBid, seasonalityPct, peakMonth]
  ['pizza a domicilio bogotá',          49500, 'HIGH',   88, 1.42, 0.85, 2.40, 0.18, 11],
  ['mejor pizzería bogotá',             33100, 'MEDIUM', 64, 0.89, 0.55, 1.60, 0.12, 11],
  ['pizza chapinero',                    8100, 'MEDIUM', 58, 0.95, 0.60, 1.70, 0.15,  9],
  ['pizza usaquén',                      6600, 'LOW',    32, 0.83, 0.50, 1.45, 0.14,  9],
  ['pizza zona t',                       5400, 'MEDIUM', 51, 1.12, 0.70, 1.90, 0.22, 11],
  ['promociones pizza bogotá',          14800, 'HIGH',   82, 1.65, 1.05, 2.85, 0.45, 11],
  ['pizza barata bogotá',               18100, 'HIGH',   79, 1.31, 0.78, 2.20, 0.20, 11],
  ['pizza vegana bogotá',                2900, 'LOW',    24, 0.51, 0.30, 0.95, 0.10,  5],
  ['pizza familiar bogotá',              4900, 'MEDIUM', 56, 1.08, 0.65, 1.85, 0.55,  4],
  ['pizza 24 horas bogotá',              3200, 'MEDIUM', 49, 1.22, 0.75, 2.10, 0.15, 11],
  ['pizza al corte bogotá',              1900, 'LOW',    21, 0.39, 0.22, 0.70, 0.08,  6],
  ['pizza artesanal bogotá',            12100, 'LOW',    35, 0.62, 0.38, 1.10, 0.12,  9],
  ['rappi pizza bogotá',                 5400, 'MEDIUM', 60, 1.45, 0.92, 2.45, 0.16, 11],
  ['pizza napolitana bogotá',            9900, 'LOW',    30, 0.71, 0.42, 1.25, 0.10,  9],
  ['cómo hacer pizza casera',           22200, 'LOW',    18, 0.18, 0.10, 0.32, 0.50,  3],
  ['domicilios pizza',                  22200, 'HIGH',   91, 1.55, 0.95, 2.65, 0.18, 11],
  ['don mario pizzería',                 1300, 'LOW',     9, 0.34, 0.20, 0.60, 0.08, 11],
  ['pizza horno de leña bogotá',         1700, 'MEDIUM', 47, 0.69, 0.42, 1.25, 0.12,  9],
  ['pizza sin gluten bogotá',             720, 'LOW',    19, 0.55, 0.32, 0.95, 0.10,  5],
  ['pizza 2x1 bogotá',                   4100, 'HIGH',   77, 0.51, 0.31, 0.92, 0.42, 11],
];

const KEYWORDS = KEYWORDS_DEF.map(([keyword, vol, comp, idx, cpc, lo, hi, seas, peak]) => {
  const monthly = makeMonths(vol, seas, peak);
  return {
    keyword,
    search_volume: vol,
    competition: comp,
    competition_index: idx,
    cpc,
    low_top_of_page_bid: lo,
    high_top_of_page_bid: hi,
    monthly_searches: monthly,
  };
});

// Aggregate monthly across all keywords
const monthlyAggregated = (() => {
  const ref = KEYWORDS[0].monthly_searches;
  return ref.map((m, i) => ({
    year_month: `${m.year}-${String(m.month).padStart(2, '0')}`,
    search_volume: KEYWORDS.reduce((sum, k) => sum + (k.monthly_searches[i]?.search_volume || 0), 0),
  }));
})();

// Detect seasonality: (peak - trough) / trough
const withSeasonality = KEYWORDS.map(k => {
  const vols = k.monthly_searches.map(m => m.search_volume);
  const peak = Math.max(...vols);
  const trough = Math.min(...vols);
  const variation = (peak - trough) / Math.max(trough, 1);
  return { ...k, peak, trough, variation };
});
const mostSeasonalKeywords = [...withSeasonality]
  .sort((a, b) => b.variation - a.variation)
  .slice(0, 5)
  .map(k => ({
    keyword: k.keyword,
    variation: k.variation,
    peak_volume: k.peak,
    trough_volume: k.trough,
    monthly_searches: k.monthly_searches,
  }));

const totalVol = KEYWORDS.reduce((s, k) => s + (k.search_volume || 0), 0);
const cpcs = KEYWORDS.map(k => k.cpc).filter(c => c != null);
const avgCpc = cpcs.reduce((a, b) => a + b, 0) / cpcs.length;
const maxCpc = Math.max(...KEYWORDS.map(k => k.high_top_of_page_bid || 0));
const minCpc = Math.min(...KEYWORDS.map(k => k.low_top_of_page_bid || Infinity).filter(c => c < Infinity));
const ppcCostEstimate = KEYWORDS.reduce((s, k) => s + (k.high_top_of_page_bid || 0), 0);
const compDist = KEYWORDS.reduce((acc, k) => { acc[k.competition] = (acc[k.competition] || 0) + 1; return acc; }, { LOW: 0, MEDIUM: 0, HIGH: 0 });

const sampleData = {
  keywords_count: KEYWORDS.length,
  total_search_volume: totalVol,
  avg_cpc: avgCpc,
  max_cpc: maxCpc,
  min_cpc: minCpc,
  total_ppc_cost_estimate_usd: ppcCostEstimate,
  competition_distribution: compDist,
  top_keywords_by_volume: [...KEYWORDS].sort((a, b) => b.search_volume - a.search_volume).slice(0, 5),
  top_keywords_by_cpc: [...KEYWORDS].sort((a, b) => (b.cpc || 0) - (a.cpc || 0)).slice(0, 5),
  monthly_aggregated: monthlyAggregated,
  most_seasonal_keywords: mostSeasonalKeywords,
  keywords: KEYWORDS,
  cost: 0.0156,
  task_time: '3.78s',
};

// ─────────────────────────────────────────────────────────────────────────────
// Formatting (Intl 'es-CO')
// ─────────────────────────────────────────────────────────────────────────────
const intCO = new Intl.NumberFormat('es-CO');
const usd = (n, d = 2) => n == null ? '—' : '$' + new Intl.NumberFormat('es-CO', { minimumFractionDigits: d, maximumFractionDigits: d }).format(n);
const fmtCompact = (n) => {
  if (n == null) return '—';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(n >= 10_000_000 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(n >= 10_000 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return String(n);
};
const fmtPct = (n) => (n >= 0 ? '+' : '') + (n * 100).toFixed(0) + '%';
const monthShort = (ym) => {
  const [y, m] = ym.split('-');
  return new Date(+y, +m - 1, 1).toLocaleString('es-CO', { month: 'short' });
};

// ─────────────────────────────────────────────────────────────────────────────
// Icons
// ─────────────────────────────────────────────────────────────────────────────
const Icon = ({ size = 16, sw = 1.6, children, style }) => (

);
const IconBars      = (p) => <Icon {...p}><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></Icon>;
const IconDollar    = (p) => <Icon {...p}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></Icon>;
const IconArrowsUD  = (p) => <Icon {...p}><path d="m17 5-5-3-5 3"/><path d="m17 19-5 3-5-3"/><line x1="12" y1="2" x2="12" y2="22"/></Icon>;
const IconCoins     = (p) => <Icon {...p}><circle cx="9" cy="9" r="7"/><path d="M22 14a7 7 0 0 1-7 7"/><path d="M22 14a7 7 0 0 0-7-7"/><path d="M15 14a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></Icon>;
const IconTrendUp   = (p) => <Icon {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Icon>;
const IconTrendDown = (p) => <Icon {...p}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></Icon>;
const IconSearch    = (p) => <Icon {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
const IconFilter    = (p) => <Icon {...p}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></Icon>;
const IconExternal  = (p) => <Icon {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></Icon>;
const IconX         = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
const IconChart     = (p) => <Icon {...p}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></Icon>;
const IconInfo      = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></Icon>;
const IconArrowUp   = (p) => <Icon {...p}><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></Icon>;
const IconArrowDown = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></Icon>;
const IconClock     = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
const IconLayers    = (p) => <Icon {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></Icon>;
const IconPlus      = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;

// ─────────────────────────────────────────────────────────────────────────────
// Primitives
// ─────────────────────────────────────────────────────────────────────────────
function Card({ children, style, accent, ...rest }) {

      background: accent ? `linear-gradient(180deg, rgba(34,197,94,0.06), ${C.card})` : C.card,

}

function Badge({ children, tone = 'default', style, title }) {

    yellow:  { bg: 'rgba(251,191,36,0.12)', fg: C.yellow, br: 'rgba(251,191,36,0.3)' },
    orange:  { bg: 'rgba(251,146,60,0.12)', fg: C.orange, br: 'rgba(251,146,60,0.3)' },
    red:     { bg: 'rgba(239,68,68,0.12)', fg: C.red, br: 'rgba(239,68,68,0.3)' },

}

function SectionTitle({ kicker, title, sub, right }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20, gap: 16, flexWrap: 'wrap' }}>
      <div>
        {kicker && <div style={{ fontFamily: 'Caveat, cursive', color: C.green, fontSize: 17, marginBottom: 4 }}>{kicker}</div>}
        <h2 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 22, color: C.text, letterSpacing: '-0.015em' }}>{title}</h2>

// Tooltip (lightweight)
function Tooltip({ children, content }) {
  const [open, setOpen] = useState(false);
  return (
    <span style={{ position: 'relative', display: 'inline-flex' }}
      onMouseEnter={() => setOpen(true)} onMouseLeave={() => setOpen(false)}>
      {children}
      {open && (
        <span style={{
          position: 'absolute', bottom: 'calc(100% + 8px)', left: '50%',
          transform: 'translateX(-50%)',
          background: 'rgba(20,20,20,0.96)',
          border: `1px solid ${C.borderStrong}`,
          color: C.text2, fontSize: 11.5, padding: '8px 12px',
          borderRadius: 8, whiteSpace: 'nowrap',
          pointerEvents: 'none', zIndex: 10,
          boxShadow: '0 8px 24px rgba(0,0,0,0.4)',
          fontFamily: 'Inter', fontWeight: 500,
        }}>{content}</span>
      )}
    </span>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// KPI Cards
// ─────────────────────────────────────────────────────────────────────────────
function KpiCard({ icon, label, value, sub, accent, info, valueColor }) {
  return (
    <Card style={{ padding: '20px 22px', display: 'flex', flexDirection: 'column', gap: 12, minHeight: 144 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <div style={{
          width: 36, height: 36, borderRadius: 10,
          background: accent ? C.greenSoft : 'rgba(255,255,255,0.06)',
          color: accent ? C.green : C.text2,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          border: `1px solid ${accent ? C.greenBorder : C.border}`,
        }}>{icon}</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <div style={{
            fontSize: 10.5, color: C.text3, letterSpacing: '0.07em',
            textTransform: 'uppercase', fontWeight: 600, textAlign: 'right',
          }}>{label}</div>
          {info && (
            <Tooltip content={info}>
              <span style={{ color: C.text4, display: 'inline-flex', cursor: 'help' }}>
                <IconInfo size={13}/>
              </span>
            </Tooltip>
          )}
        </div>
      </div>
      <div style={{ marginTop: 'auto' }}>
        <div style={{
          fontFamily: 'Syne, sans-serif', fontWeight: 800,
          fontSize: 32, lineHeight: 1, color: valueColor || (accent ? C.green : C.text),
          letterSpacing: '-0.02em',
        }}>{value}</div>
        {sub && <div style={{ fontSize: 12, color: C.text3, marginTop: 6 }}>{sub}</div>}
      </div>
    </Card>
  );
}

function KpiRow({ data }) {
  return (
    <div className="kpi-grid" style={{
      display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 36,
    }}>
      <KpiCard
        icon={<IconBars size={18}/>}
        label="Volumen total"
        value={fmtCompact(data.total_search_volume)}
        sub={`${intCO.format(data.total_search_volume)} búsquedas/mes`}
        accent
      />
      <KpiCard
        icon={<IconDollar size={18}/>}
        label="CPC promedio"
        value={usd(data.avg_cpc)}
        sub={`a través de ${data.keywords_count} keywords`}
      />
      <KpiCard
        icon={<IconArrowsUD size={18}/>}
        label="Rango CPC"
        value={
          <span style={{ display: 'inline-flex', alignItems: 'baseline', gap: 8, lineHeight: 1 }}>
            <span style={{ color: C.green }}>{usd(data.min_cpc)}</span>
            <span style={{ color: C.text4, fontSize: 18, fontWeight: 400 }}>→</span>
            <span style={{ color: C.red }}>{usd(data.max_cpc)}</span>
          </span>
        }
        sub="puja mínima → máxima top de página"
      />
      <KpiCard
        icon={<IconCoins size={18}/>}
        label="Costo PPC estimado"
        value={usd(data.total_ppc_cost_estimate_usd, 0)}
        sub="suma de pujas máximas"
        info="1 clic por keyword al CPC máximo"
      />
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Area chart (recharts-style, SVG)
// ─────────────────────────────────────────────────────────────────────────────
function AreaChart({ data, height = 240 }) {
  const wrapRef = useRef(null);
  const [w, setW] = useState(640);
  const [hover, setHover] = useState(null);

  useEffect(() => {
    if (!wrapRef.current) return;
    const ro = new ResizeObserver(() => {
      const r = wrapRef.current.getBoundingClientRect();
      setW(Math.max(300, r.width));
    });
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);

  const pad = { l: 56, r: 16, t: 18, b: 36 };
  const iw = w - pad.l - pad.r;
  const ih = height - pad.t - pad.b;
  const max = Math.max(...data.map(d => d.search_volume)) * 1.15;
  const xAt = (i) => pad.l + (i / (data.length - 1)) * iw;
  const yAt = (v) => pad.t + ih - (v / max) * ih;

  const linePath = data.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xAt(i).toFixed(1)} ${yAt(p.search_volume).toFixed(1)}`).join(' ');
  const areaPath = linePath + ` L ${xAt(data.length - 1)} ${pad.t + ih} L ${xAt(0)} ${pad.t + ih} Z`;
  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => max * t);

  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * w;
    const i = Math.round(((x - pad.l) / iw) * (data.length - 1));
    if (i >= 0 && i < data.length) setHover(i);
    else setHover(null);
  };

  return (
    <div ref={wrapRef} style={{ width: '100%', position: 'relative' }}>
      <svg width={w} height={height} onMouseMove={onMove} onMouseLeave={() => setHover(null)} style={{ display: 'block', cursor: 'crosshair' }}>
        <defs>
          <linearGradient id="agg-area" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={C.green} stopOpacity="0.4"/>
            <stop offset="100%" stopColor={C.green} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {yTicks.map((t, i) => (
          <g key={i}>
            <line x1={pad.l} x2={w - pad.r} y1={yAt(t)} y2={yAt(t)} stroke="rgba(255,255,255,0.05)" strokeDasharray="2 4"/>
            <text x={pad.l - 8} y={yAt(t) + 4} textAnchor="end" fontSize="10.5" fontFamily="JetBrains Mono, monospace" fill={C.text3}>{fmtCompact(t)}</text>
          </g>
        ))}
        <path d={areaPath} fill="url(#agg-area)"/>
        <path d={linePath} fill="none" stroke={C.green} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
              style={{ filter: `drop-shadow(0 0 6px ${C.green}66)` }}/>
        {data.map((p, i) => (
          <circle key={i} cx={xAt(i)} cy={yAt(p.search_volume)} r={hover === i ? 5 : 3} fill={C.bg} stroke={C.green} strokeWidth="2"/>
        ))}
        {data.map((p, i) => (
          <text key={`x-${i}`} x={xAt(i)} y={height - pad.b + 18} textAnchor="middle" fontSize="10.5" fontFamily="Inter" fill={C.text3}>
            {monthShort(p.year_month)}
          </text>
        ))}
        {hover != null && (
          <line x1={xAt(hover)} x2={xAt(hover)} y1={pad.t} y2={pad.t + ih} stroke={C.green} strokeOpacity="0.4" strokeDasharray="3 3"/>
        )}
      </svg>
      {hover != null && (
        <div style={{
          position: 'absolute',
          left: Math.min(w - 170, Math.max(8, xAt(hover) + 12)),
          top: yAt(data[hover].search_volume) - 56,
          background: 'rgba(20,20,20,0.96)',
          border: `1px solid ${C.borderStrong}`,
          borderRadius: 10, padding: '8px 12px',

        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Donut chart for competition
// ─────────────────────────────────────────────────────────────────────────────
function CompetitionDonut({ dist }) {
  const [hover, setHover] = useState(null);
  const entries = ['LOW', 'MEDIUM', 'HIGH'].map(k => ({ key: k, value: dist[k] || 0, ...COMPETITION_META[k] }));
  const total = entries.reduce((s, e) => s + e.value, 0);
  const cx = 90, cy = 90, r = 72, ir = 48;
  let angle = -Math.PI / 2;

  const arcs = entries.filter(e => e.value > 0).map((e) => {
    const a0 = angle;
    const a1 = angle + (e.value / total) * Math.PI * 2;
    angle = a1;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const x0 = cx + Math.cos(a0) * r,  y0 = cy + Math.sin(a0) * r;
    const x1 = cx + Math.cos(a1) * r,  y1 = cy + Math.sin(a1) * r;
    const xi0 = cx + Math.cos(a0) * ir, yi0 = cy + Math.sin(a0) * ir;
    const xi1 = cx + Math.cos(a1) * ir, yi1 = cy + Math.sin(a1) * ir;
    return { ...e, d: `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${xi1} ${yi1} A ${ir} ${ir} 0 ${large} 0 ${xi0} ${yi0} Z` };
  });

  const current = hover != null ? entries[hover] : null;
  const centerVal = current ? current.value : total;
  const centerLabel = current ? current.label : 'Total';

  return (
    <Card style={{ padding: 24, height: '100%' }}>
      <SectionTitle title="Distribución de competencia" sub="Nivel de competencia publicitaria por keyword"/>
      <div style={{ display: 'flex', alignItems: 'center', gap: 24, flexWrap: 'wrap' }}>
        <div style={{ position: 'relative', width: 180, height: 180, flexShrink: 0 }}>
          <svg width="180" height="180" viewBox="0 0 180 180">
            {arcs.map((a, i) => (
              <path key={a.key} d={a.d} fill={a.color}
                fillOpacity={hover == null || entries[hover]?.key === a.key ? 1 : 0.25}
                stroke={C.bg} strokeWidth="2"
                onMouseEnter={() => setHover(entries.findIndex(e => e.key === a.key))}
                onMouseLeave={() => setHover(null)}
                style={{ cursor: 'pointer', transition: 'fill-opacity 0.15s' }}/>
            ))}
          </svg>
          <div style={{
            position: 'absolute', inset: 0,
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            pointerEvents: 'none',
          }}>
            <div style={{ fontSize: 11, color: C.text3, fontWeight: 500, marginBottom: 2 }}>{centerLabel}</div>
            <div style={{ fontFamily: 'Syne', fontWeight: 800, fontSize: 30, color: C.text }}>{centerVal}</div>
            <div style={{ fontSize: 10.5, color: C.text3 }}>keywords</div>
          </div>
        </div>
        <div style={{ flex: 1, minWidth: 160, display: 'flex', flexDirection: 'column', gap: 8 }}>
          {entries.map((e, i) => (
            <div key={e.key}
              onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}
              style={{
                display: 'flex', alignItems: 'center', gap: 10,
                padding: '8px 10px', borderRadius: 8,
                background: hover === i ? 'rgba(255,255,255,0.04)' : 'transparent',
                cursor: 'default',
              }}>
              <span style={{ width: 10, height: 10, borderRadius: 3, background: e.color }}/>
              <span style={{ flex: 1, fontSize: 13, color: C.text2, fontWeight: 500 }}>{e.label}</span>
              <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 13, color: C.text, fontWeight: 600 }}>{e.value}</span>
              <span style={{ fontSize: 11, color: C.text3, minWidth: 38, textAlign: 'right' }}>
                {total ? ((e.value / total) * 100).toFixed(0) : 0}%
              </span>
            </div>
          ))}
        </div>
      </div>
    </Card>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Sparkline with optional peak/trough markers
// ─────────────────────────────────────────────────────────────────────────────
function Sparkline({ data, w = 140, h = 40, markPeakTrough = false, color = C.green, peakColor = C.green, troughColor = C.red }) {
  if (!data || !data.length) return null;
  const vs = data.map(d => d.search_volume);
  const max = Math.max(...vs), min = Math.min(...vs);
  const range = max - min || 1;
  const padT = 4, padB = 4;
  const xAt = (i) => (i / (vs.length - 1)) * w;
  const yAt = (v) => padT + (h - padT - padB) - ((v - min) / range) * (h - padT - padB);

  const linePath = vs.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xAt(i).toFixed(1)} ${yAt(v).toFixed(1)}`).join(' ');
  const areaPath = linePath + ` L ${w} ${h} L 0 ${h} Z`;
  const peakIdx = vs.indexOf(max);
  const troughIdx = vs.indexOf(min);
  const gid = `spk-${Math.round(Math.random()*1e6)}`;

  return (
    <svg width={w} height={h} style={{ display: 'block' }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.32"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={areaPath} fill={`url(#${gid})`}/>
      <path d={linePath} stroke={color} strokeWidth="1.5" fill="none" strokeLinejoin="round" strokeLinecap="round"/>
      {markPeakTrough && (
        <>
          <circle cx={xAt(peakIdx)} cy={yAt(max)} r="3.5" fill={peakColor} stroke={C.bg} strokeWidth="1.5"/>
          <circle cx={xAt(troughIdx)} cy={yAt(min)} r="3.5" fill={troughColor} stroke={C.bg} strokeWidth="1.5"/>
        </>
      )}
    </svg>
  );
}

// Multi-select dropdown (for competition filter)

function MultiSelect({ label, value, options, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onClick = (e) => { if (!ref.current?.contains(e.target)) setOpen(false); };
    window.addEventListener('mousedown', onClick);
    return () => window.removeEventListener('mousedown', onClick);
  }, [open]);

  const toggle = (v) => {
    onChange(value.includes(v) ? value.filter(x => x !== v) : [...value, v]);
  };

  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button onClick={() => setOpen(o => !o)} style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        background: value.length ? C.greenSoft : 'rgba(255,255,255,0.04)',
        border: `1px solid ${value.length ? C.greenBorder : C.border}`,
        color: value.length ? C.green : C.text2,
        padding: '7px 12px', borderRadius: 8,
        fontSize: 12.5, fontWeight: 500, cursor: 'pointer',
      }}>
        <IconFilter size={12}/>
        {label}
        {value.length > 0 && (
          <span style={{
            background: C.green, color: C.bg, fontSize: 10, fontWeight: 700,
            padding: '1px 6px', borderRadius: 999, fontFamily: 'JetBrains Mono',
          }}>{value.length}</span>
        )}
      </button>
      {open && (
        <div style={{
          position: 'absolute', top: 'calc(100% + 6px)', left: 0, zIndex: 20,
          background: '#141414', border: `1px solid ${C.borderStrong}`,
          borderRadius: 10, padding: 6, minWidth: 160,
          boxShadow: '0 12px 40px rgba(0,0,0,0.5)',
        }}>
          {options.map(opt => (
            <button key={opt.value} onClick={() => toggle(opt.value)} style={{
              display: 'flex', alignItems: 'center', gap: 10, width: '100%',
              padding: '8px 10px', borderRadius: 6,
              background: value.includes(opt.value) ? 'rgba(34,197,94,0.08)' : 'transparent',
              border: 'none', color: C.text, fontSize: 13,
              cursor: 'pointer', textAlign: 'left',
            }}
            onMouseEnter={e => { if (!value.includes(opt.value)) e.currentTarget.style.background = 'rgba(255,255,255,0.04)'; }}
            onMouseLeave={e => { if (!value.includes(opt.value)) e.currentTarget.style.background = 'transparent'; }}>
              <div style={{
                width: 16, height: 16, borderRadius: 4,
                border: `1px solid ${value.includes(opt.value) ? C.green : C.border}`,
                background: value.includes(opt.value) ? C.green : 'transparent',

                color: C.bg, flexShrink: 0,
              }}>
                {value.includes(opt.value) && <IconCheck size={11} sw={3}/>}
              </div>
              {opt.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Main keywords table + filters
// ─────────────────────────────────────────────────────────────────────────────
function KeywordsTable({ keywords, selected, setSelected, onOpenTrend }) {
  const [sort, setSort] = useState({ key: 'search_volume', dir: 'desc' });
  const [search, setSearch] = useState('');
  const [minVol, setMinVol] = useState('');
  const [maxVol, setMaxVol] = useState('');
  const [compFilter, setCompFilter] = useState([]);

  const filtered = useMemo(() => {
    return keywords.filter(k => {
      if (search && !k.keyword.toLowerCase().includes(search.toLowerCase())) return false;
      if (compFilter.length && !compFilter.includes(k.competition)) return false;
      const v = k.search_volume || 0;
      if (minVol && v < +minVol) return false;
      if (maxVol && v > +maxVol) return false;
      return true;
    });
  }, [keywords, search, minVol, maxVol, compFilter]);

  const sorted = useMemo(() => {
    const arr = [...filtered];
    const dir = sort.dir === 'asc' ? 1 : -1;
    arr.sort((a, b) => {
      let va = a[sort.key], vb = b[sort.key];
      if (va == null) return 1;
      if (vb == null) return -1;
      if (typeof va === 'string') return va.localeCompare(vb) * dir;
      return (va - vb) * dir;
    });
    return arr;
  }, [filtered, sort]);

  const toggleSort = (key) => setSort(s => s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'desc' });
  const toggleSelected = (kw) => {
    setSelected(s => s.includes(kw) ? s.filter(x => x !== kw) : s.length >= 8 ? s : [...s, kw]);
  };

  const SortHead = ({ k, children, w, align }) => (
    <th style={{
      textAlign: align || 'left', width: w,
      padding: '14px 16px', fontSize: 10.5,
      fontWeight: 600, color: C.text3,
      letterSpacing: '0.07em', textTransform: 'uppercase',
      borderBottom: `1px solid ${C.border}`,
      cursor: 'pointer', userSelect: 'none', whiteSpace: 'nowrap',
      background: 'rgba(255,255,255,0.02)',
    }} onClick={() => toggleSort(k)}>
      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}>
        {children}
        {sort.key === k && (sort.dir === 'asc' ? <IconArrowUp size={11}/> : <IconArrowDown size={11}/>)}
      </span>
    </th>
  );

  return (
    <div>
      <SectionTitle
        kicker="Tabla maestra"
        title={`${filtered.length} keywords`}
        sub="Selecciona keywords para comparar (máx. 8) o abre la tendencia detallada"
        right={
          <Badge tone="default" style={{ fontSize: 12, padding: '4px 10px' }}>
            <IconLayers size={11}/> {keywords.length} totales

        }
      />

      {/* Filter bar */}
      <div className="filter-bar" style={{
        display: 'flex', gap: 10, alignItems: 'center',
        padding: '12px 14px', background: 'rgba(255,255,255,0.02)',
        borderRadius: 12, border: `1px solid ${C.border}`,
        marginBottom: 14, flexWrap: 'wrap',
      }}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 8,
          padding: '7px 12px', borderRadius: 8,
          background: 'rgba(255,255,255,0.04)',
          border: `1px solid ${C.border}`,
          flex: 1, minWidth: 200,
        }}>
          <IconSearch size={14} style={{ color: C.text3 }}/>
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Buscar keyword..."
            style={{ flex: 1, fontSize: 13, color: C.text }}/>
          {search && <button onClick={() => setSearch('')} style={{
            background: 'transparent', border: 'none', color: C.text3, cursor: 'pointer',
            display: 'inline-flex', padding: 0,
          }}><IconX size={13}/></button>}
        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <span style={{ fontSize: 11, color: C.text3, letterSpacing: '0.04em' }}>Volumen:</span>
          <input value={minVol} onChange={e => setMinVol(e.target.value.replace(/\D/g, ''))}
            placeholder="Min" inputMode="numeric"
            style={{
              width: 80, fontSize: 12.5, color: C.text,
              padding: '7px 10px', borderRadius: 8,
              background: 'rgba(255,255,255,0.04)',
              border: `1px solid ${C.border}`,
              fontFamily: 'JetBrains Mono, monospace',
            }}/>
          <span style={{ color: C.text4 }}>—</span>
          <input value={maxVol} onChange={e => setMaxVol(e.target.value.replace(/\D/g, ''))}
            placeholder="Max" inputMode="numeric"
            style={{
              width: 80, fontSize: 12.5, color: C.text,
              padding: '7px 10px', borderRadius: 8,
              background: 'rgba(255,255,255,0.04)',
              border: `1px solid ${C.border}`,
              fontFamily: 'JetBrains Mono, monospace',
            }}/>
        </div>

        <MultiSelect
          label="Competencia"
          value={compFilter}
          options={[
            { value: 'LOW', label: 'Baja' },
            { value: 'MEDIUM', label: 'Media' },
            { value: 'HIGH', label: 'Alta' },
          ]}
          onChange={setCompFilter}
        />

        {(search || minVol || maxVol || compFilter.length > 0) && (
          <button onClick={() => { setSearch(''); setMinVol(''); setMaxVol(''); setCompFilter([]); }}
            style={{
              background: 'transparent', border: 'none', color: C.text3,

                <th style={{
                  padding: '14px 16px', fontSize: 10.5, fontWeight: 600,

                  background: 'rgba(255,255,255,0.02)', width: 110,
                }}>Tendencia</th>
              </tr>
            </thead>
            <tbody>
              {sorted.map(k => {
                const isSelected = selected.includes(k.keyword);
                const compMeta = k.competition ? COMPETITION_META[k.competition] : null;
                const seriesColor = SERIES_COLORS[selected.indexOf(k.keyword) % SERIES_COLORS.length];
                return (

                    {/* Checkbox for comparison */}
                    <td style={{ padding: '12px 16px', borderBottom: `1px solid ${C.border}` }}>

// ─────────────────────────────────────────────────────────────────────────────
// Comparativa multi-line chart
// ─────────────────────────────────────────────────────────────────────────────
function ComparativaChart({ keywords, selected, setSelected }) {
  const wrapRef = useRef(null);
  const [w, setW] = useState(900);
  const [hover, setHover] = useState(null);
  useEffect(() => {
    if (!wrapRef.current) return;
    const ro = new ResizeObserver(() => {
      const r = wrapRef.current.getBoundingClientRect();
      setW(Math.max(360, r.width));
    });
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);

  const series = selected.map(kw => keywords.find(k => k.keyword === kw)).filter(Boolean);
  const h = 320, pad = { l: 56, r: 16, t: 18, b: 36 };
  const iw = w - pad.l - pad.r;
  const ih = h - pad.t - pad.b;

  if (series.length === 0) {
    return (
      <Card style={{ padding: 28 }}>
        <SectionTitle
          kicker="Comparativa"
          title="Comparativa de keywords"
          sub="Selecciona keywords en la tabla para superponerlas aquí"
        />
        <div style={{
          padding: '60px 24px', textAlign: 'center',
          background: 'rgba(255,255,255,0.02)',
          border: `1px dashed ${C.border}`, borderRadius: 12,
        }}>
          <div style={{
            width: 56, height: 56, borderRadius: 14,
            background: C.greenSoft, color: C.green,
            border: `1px solid ${C.greenBorder}`,
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            marginBottom: 14,
          }}>
            <IconChart size={24}/>
          </div>
          <div style={{ fontFamily: 'Syne', fontWeight: 700, fontSize: 17, color: C.text, marginBottom: 6 }}>
            Ninguna keyword seleccionada
          </div>
          <div style={{ fontSize: 13, color: C.text3, maxWidth: 380, margin: '0 auto' }}>
            Activa el checkbox a la izquierda de cualquier keyword en la tabla para superponer su tendencia de 12 meses aquí.
          </div>
        </div>
      </Card>
    );
  }

  const allMonths = series[0].monthly_searches.map(m => `${m.year}-${String(m.month).padStart(2, '0')}`);
  const max = Math.max(...series.flatMap(s => s.monthly_searches.map(m => m.search_volume))) * 1.1;

  const xAt = (i) => pad.l + (i / (allMonths.length - 1)) * iw;
  const yAt = (v) => pad.t + ih - (v / max) * ih;

  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => max * t);

  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * w;
    const i = Math.round(((x - pad.l) / iw) * (allMonths.length - 1));
    if (i >= 0 && i < allMonths.length) setHover(i);
    else setHover(null);
  };

  return (
    <Card style={{ padding: 28 }}>
      <SectionTitle
        kicker="Comparativa"
        title="Comparativa de keywords"
        sub={`${series.length} keyword${series.length === 1 ? '' : 's'} superpuesta${series.length === 1 ? '' : 's'}`}
        right={
          <button onClick={() => setSelected([])} style={{
            background: 'transparent', border: `1px solid ${C.border}`,
            color: C.text2, fontSize: 12, padding: '6px 12px', borderRadius: 8,
            cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6,
          }}>
            <IconX size={12}/> Limpiar
          </button>
        }
      />

      {/* Legend chips */}
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 16 }}>
        {series.map((s, i) => (
          <div key={s.keyword} style={{
            display: 'inline-flex', alignItems: 'center', gap: 8,
            padding: '5px 6px 5px 10px', borderRadius: 999,
            background: `${SERIES_COLORS[i]}15`,
            border: `1px solid ${SERIES_COLORS[i]}55`,
            fontSize: 12, color: C.text, fontWeight: 500,
          }}>
            <span style={{ width: 8, height: 8, borderRadius: '50%', background: SERIES_COLORS[i] }}/>
            {s.keyword}
            <button onClick={() => setSelected(sel => sel.filter(x => x !== s.keyword))} style={{
              background: 'rgba(255,255,255,0.06)', border: 'none',
              color: C.text2, width: 18, height: 18, borderRadius: '50%',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer', padding: 0,
            }}><IconX size={10}/></button>
          </div>
        ))}
      </div>

      <div ref={wrapRef} style={{ width: '100%', position: 'relative' }}>
        <svg width={w} height={h} onMouseMove={onMove} onMouseLeave={() => setHover(null)} style={{ display: 'block', cursor: 'crosshair' }}>
          {/* y grid */}
          {yTicks.map((t, i) => (
            <g key={i}>
              <line x1={pad.l} x2={w - pad.r} y1={yAt(t)} y2={yAt(t)} stroke="rgba(255,255,255,0.05)" strokeDasharray="2 4"/>
              <text x={pad.l - 8} y={yAt(t) + 4} textAnchor="end" fontSize="10.5" fontFamily="JetBrains Mono, monospace" fill={C.text3}>{fmtCompact(t)}</text>
            </g>
          ))}
          {/* x labels */}
          {allMonths.map((m, i) => (
            <text key={i} x={xAt(i)} y={h - pad.b + 18} textAnchor="middle" fontSize="10.5" fontFamily="Inter" fill={C.text3}>
              {monthShort(m)}
            </text>
          ))}
          {/* Lines */}
          {series.map((s, idx) => {
            const path = s.monthly_searches.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xAt(i).toFixed(1)} ${yAt(p.search_volume).toFixed(1)}`).join(' ');
            return (
              <g key={s.keyword}>
                <path d={path} stroke={SERIES_COLORS[idx]} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
                {s.monthly_searches.map((p, i) => (
                  <circle key={i} cx={xAt(i)} cy={yAt(p.search_volume)} r={hover === i ? 4 : 2.5}
                    fill={C.bg} stroke={SERIES_COLORS[idx]} strokeWidth="1.6"/>
                ))}
              </g>
            );
          })}
          {hover != null && (
            <line x1={xAt(hover)} x2={xAt(hover)} y1={pad.t} y2={pad.t + ih} stroke={C.text3} strokeOpacity="0.5" strokeDasharray="3 3"/>
          )}
        </svg>

        {hover != null && (
          <div style={{
            position: 'absolute',
            left: Math.min(w - 240, Math.max(8, xAt(hover) + 12)),
            top: 12,
            background: 'rgba(20,20,20,0.96)',
            border: `1px solid ${C.borderStrong}`,
            borderRadius: 10, padding: '10px 12px',
            pointerEvents: 'none', minWidth: 200,
            boxShadow: '0 10px 30px rgba(0,0,0,0.5)',
          }}>
            <div style={{ fontSize: 11, color: C.text3, marginBottom: 6 }}>
              {new Date(allMonths[hover] + '-01').toLocaleString('es-CO', { month: 'long', year: 'numeric' })}
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
              {series.map((s, idx) => (
                <div key={s.keyword} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12 }}>
                  <span style={{ width: 8, height: 8, borderRadius: '50%', background: SERIES_COLORS[idx] }}/>
                  <span style={{ color: C.text2, flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 140 }}>{s.keyword}</span>
                  <span style={{ fontFamily: 'JetBrains Mono, monospace', color: C.text, fontWeight: 600 }}>
                    {fmtCompact(s.monthly_searches[hover].search_volume)}
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </Card>
  );
}

          Datos de <span style={{ color: C.green }}>Google Ads</span> para tu nicho
        </h1>
        <p style={{ fontSize: 15, color: C.text2, fontFamily: 'Inter' }}>
          {intCO.format(data.keywords_count)} keywords con datos de volumen y CPC vía Keyword Planner
        </p>
      </header>

      <KpiRow data={data}/>

      {/* Two-col: Trend + Donut */}
      <div className="two-col" style={{
        display: 'grid', gridTemplateColumns: '1.7fr 1fr',
        gap: 16, marginBottom: 36, alignItems: 'stretch',
      }}>
        <MonthlyTrend data={data.monthly_aggregated}/>
        <CompetitionDonut dist={data.competition_distribution}/>
      </div>

      {/* Seasonality */}
      <div style={{ marginBottom: 36 }}>
        <SeasonalityCard items={data.most_seasonal_keywords}/>
      </div>

      {/* Top performers */}
      <div className="top-perf-grid" style={{
        display: 'grid', gridTemplateColumns: '1fr 1fr',
        gap: 16, marginBottom: 36,
      }}>
        <TopByVolume items={data.top_keywords_by_volume}/>
        <TopByCpc items={data.top_keywords_by_cpc}/>
      </div>

      {/* Master table */}
      <div style={{ marginBottom: 36 }}>
        <KeywordsTable
          keywords={data.keywords}
          selected={selected}
          setSelected={setSelected}
          onOpenTrend={setTrendKw}
        />
      </div>

      {/* Comparativa */}
      <ComparativaChart
        keywords={data.keywords}
        selected={selected}
        setSelected={setSelected}
      />

      <OpsFooter data={data}/>

      <Dialog open={!!trendKw} onClose={() => setTrendKw(null)} keyword={trendKw}/>
    </div>
  );
}
