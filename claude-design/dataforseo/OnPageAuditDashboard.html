const scoreLabel = (s) => s >= 80 ? 'Excelente' : s >= 50 ? 'Mejorable' : 'Crítico';

// Core Web Vitals thresholds (Google)
const cwvColor = (metric, v) => {
  if (metric === 'LCP') return v < 2500 ? C.green : v < 4000 ? C.amber : C.red;
  if (metric === 'FID') return v < 100 ? C.green : v < 300 ? C.amber : C.red;
  if (metric === 'CLS') return v < 0.1 ? C.green : v < 0.25 ? C.amber : C.red;
  if (metric === 'TTI') return v < 3800 ? C.green : v < 7300 ? C.amber : C.red;
  if (metric === 'DOM') return v < 2000 ? C.green : v < 4000 ? C.amber : C.red;
  return C.text3;
};
const cwvLabel = (metric, v) => {
  if (metric === 'LCP') return v < 2500 ? 'Bueno' : v < 4000 ? 'Mejorable' : 'Pobre';
  if (metric === 'FID') return v < 100 ? 'Bueno' : v < 300 ? 'Mejorable' : 'Pobre';
  if (metric === 'CLS') return v < 0.1 ? 'Bueno' : v < 0.25 ? 'Mejorable' : 'Pobre';
  return v < 3800 ? 'Rápido' : v < 7300 ? 'Promedio' : 'Lento';
};

const fmtBytes = (n) => {
  if (n == null) return '—';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(n >= 10_000_000 ? 0 : 2).replace(/\.00$/, '') + ' MB';
  if (n >= 1_000) return (n / 1_000).toFixed(n >= 10_000 ? 0 : 1).replace(/\.0$/, '') + ' KB';
  return n + ' B';
};
const fmtMs = (n) => {
  if (n == null) return '—';
  if (n >= 1000) return (n / 1000).toFixed(2).replace(/\.?0+$/, '') + ' s';
  return Math.round(n) + ' ms';
};

// ─────────────────────────────────────────────────────────────────────────────

function RadialScore({ score, size = 200, stroke = 18, label }) {
  const color = scoreColor(score);
  const r = (size - stroke) / 2;
  const cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  const startAngle = 135; // degrees
  const sweep = 270;      // degrees
  const dashArr = `${(sweep / 360) * circ} ${circ}`;
  const dashOff = (1 - score / 100) * (sweep / 360) * circ;

  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: `rotate(${startAngle}deg)`, display: 'block' }}>
        <defs>
          <linearGradient id="rad-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stopColor={color}/>
            <stop offset="100%" stopColor={color} stopOpacity="0.6"/>
          </linearGradient>
          <filter id="rad-glow">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        {/* Track */}
        <circle cx={cx} cy={cy} r={r} fill="none"
          stroke="rgba(255,255,255,0.06)" strokeWidth={stroke}
          strokeDasharray={`${(sweep / 360) * circ} ${circ}`} strokeLinecap="round"/>
        {/* Progress */}
        <circle cx={cx} cy={cy} r={r} fill="none"
          stroke="url(#rad-grad)" strokeWidth={stroke}
          strokeDasharray={dashArr} strokeDashoffset={dashOff}
          strokeLinecap="round" filter="url(#rad-glow)"
          style={{ transition: 'stroke-dashoffset 0.8s cubic-bezier(0.2, 0.9, 0.3, 1)' }}/>
      </svg>
      <div style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
        pointerEvents: 'none',
      }}>
        <div style={{
          fontFamily: 'Syne', fontWeight: 800, fontSize: 56,
          color: color, lineHeight: 1, letterSpacing: '-0.04em',
        }}>{score}</div>
        <div style={{ fontSize: 12, color: C.text3, fontWeight: 500, marginTop: 4 }}>/ 100</div>
        <div style={{
          fontFamily: 'Inter', fontSize: 12, fontWeight: 600,
          color: color, marginTop: 8,
          letterSpacing: '0.04em', textTransform: 'uppercase',
        }}>{label || scoreLabel(score)}</div>
      </div>
    </div>
  );
}

function HttpStatusDonut({ statusCode, statusClass }) {
  const classes = [
    { key: '2xx', label: 'OK',          color: C.green },
    { key: '3xx', label: 'Redirect',    color: C.blue },
    { key: '4xx', label: 'Client error', color: C.amber },
    { key: '5xx', label: 'Server error', color: C.red },
  ];
  const size = 110, stroke = 14, r = (size - stroke) / 2;
  const cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  const each = circ / 4;
  const gap = 4;

  const activeColor = classes.find(c => c.key === statusClass)?.color || C.text3;

  return (
    <Card style={{ padding: 24, height: '100%' }}>
      <SectionTitle title="Estado HTTP" sub="Clase de respuesta del servidor"/>
      <div style={{ display: 'flex', alignItems: 'center', gap: 24 }}>
        <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
          <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
            {classes.map((cls, i) => {
              const isActive = cls.key === statusClass;
              return (
                <circle key={cls.key}
                  cx={cx} cy={cy} r={r} fill="none"
                  stroke={isActive ? cls.color : 'rgba(255,255,255,0.06)'}
                  strokeWidth={stroke}
                  strokeDasharray={`${each - gap} ${circ - (each - gap)}`}
                  strokeDashoffset={-i * each}
                  strokeLinecap="round"
                  style={{
                    filter: isActive ? `drop-shadow(0 0 6px ${cls.color}66)` : 'none',
                    transition: 'stroke 0.4s',
                  }}/>
              );
            })}
          </svg>
          <div style={{
            position: 'absolute', inset: 0,
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            pointerEvents: 'none',
          }}>
            <div style={{
              fontFamily: 'Syne', fontWeight: 800, fontSize: 22, color: activeColor, lineHeight: 1,
            }}>{statusCode}</div>
            <div style={{ fontSize: 10, color: C.text3, fontWeight: 500, marginTop: 2, letterSpacing: '0.04em' }}>
              {statusClass}
            </div>
          </div>
        </div>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 7 }}>
          {classes.map(cls => {
            const isActive = cls.key === statusClass;
            return (
              <div key={cls.key} style={{
                display: 'flex', alignItems: 'center', gap: 8,
                padding: '4px 8px', borderRadius: 6,
                background: isActive ? `${cls.color}15` : 'transparent',
                border: `1px solid ${isActive ? `${cls.color}40` : 'transparent'}`,
                opacity: isActive ? 1 : 0.5,
              }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: cls.color }}/>
                <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 12, color: C.text, fontWeight: 600 }}>
                  {cls.key}
                </span>
                <span style={{ fontSize: 12, color: C.text2, flex: 1 }}>{cls.label}</span>
                {isActive && <IconCheck size={13} style={{ color: cls.color }}/>}
              </div>
            );
          })}
        </div>
      </div>
    </Card>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Performance gauges
// ─────────────────────────────────────────────────────────────────────────────
function Gauge({ metric, value, label, format, ranges }) {
  // ranges: [good, poor] thresholds
  const color = cwvColor(metric, value);
  const cwLabel = cwvLabel(metric, value);

  // Map value to 0..100 for the arc (poor = full, capped)
  const pct = Math.min(100, Math.max(0, (value / ranges[1]) * 100));

  const size = 130, stroke = 12, r = (size - stroke) / 2;
  const cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  const sweep = 270; // degrees visible
  const dashArr = `${(sweep / 360) * circ} ${circ}`;
  const dashOff = (1 - pct / 100) * (sweep / 360) * circ;

  return (
    <Card style={{ padding: 20, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
      <div style={{
        fontSize: 11, color: C.text3, letterSpacing: '0.06em',
        textTransform: 'uppercase', fontWeight: 600,
      }}>{label}</div>
      <div style={{ position: 'relative', width: size, height: size }}>
        <svg width={size} height={size} style={{ transform: 'rotate(135deg)' }}>
          <circle cx={cx} cy={cy} r={r} fill="none"
            stroke="rgba(255,255,255,0.06)" strokeWidth={stroke}
            strokeDasharray={`${(sweep / 360) * circ} ${circ}`} strokeLinecap="round"/>
          <circle cx={cx} cy={cy} r={r} fill="none"
            stroke={color} strokeWidth={stroke}
            strokeDasharray={dashArr} strokeDashoffset={dashOff}
            strokeLinecap="round"
            style={{
              filter: `drop-shadow(0 0 6px ${color}66)`,
              transition: 'stroke-dashoffset 0.8s cubic-bezier(0.2, 0.9, 0.3, 1)',
            }}/>
        </svg>
        <div style={{
          position: 'absolute', inset: 0,
          display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
        }}>
          <div style={{
            fontFamily: 'Syne', fontWeight: 800, fontSize: 22,
            color: color, lineHeight: 1, letterSpacing: '-0.02em',
          }}>{format(value)}</div>
          <div style={{ fontSize: 10, color: color, fontWeight: 600, marginTop: 4, letterSpacing: '0.04em', textTransform: 'uppercase' }}>
            {cwLabel}
          </div>
        </div>
      </div>
      <div style={{ fontSize: 10.5, color: C.text3, fontFamily: 'JetBrains Mono, monospace' }}>
        umbral &lt; {format(ranges[0])}
      </div>
    </Card>
  );
}

function ResourcesBar({ rb, pageSize }) {
  const segs = [
    { key: 'scripts',     label: 'Scripts',     count: rb.scripts_count,     size: rb.scripts_size,     color: C.amber, icon: <IconCode size={13}/> },
    { key: 'stylesheets', label: 'Stylesheets', count: rb.stylesheets_count, size: rb.stylesheets_size, color: C.purple, icon: <IconBrush size={13}/> },
    { key: 'images',      label: 'Imágenes',    count: rb.images_count,      size: rb.images_size,      color: C.blue, icon: <IconImg size={13}/> },
  ];
  const known = segs.reduce((s, x) => s + x.size, 0);
  const other = Math.max(0, pageSize - known);
  if (other > 0) segs.push({ key: 'other', label: 'Otros', count: null, size: other, color: 'rgba(255,255,255,0.18)', icon: <IconLayers size={13}/> });
  const total = segs.reduce((s, x) => s + x.size, 0);

  return (
    <Card style={{ padding: 24 }}>
      <SectionTitle
        kicker="Recursos"
        title="Peso de la página"
        sub={`Total ${fmtBytes(pageSize)} — desglose por tipo de recurso`}
        right={
          <Badge tone={pageSize > 2_000_000 ? 'red' : pageSize > 1_000_000 ? 'amber' : 'green'}>
            {pageSize > 2_000_000 ? 'Pesada' : pageSize > 1_000_000 ? 'Moderada' : 'Ligera'}
          </Badge>
        }
      />

      {/* Stacked bar */}
      <div style={{
        display: 'flex', width: '100%', height: 40,
        borderRadius: 10, overflow: 'hidden',
        border: `1px solid ${C.border}`, marginBottom: 18,
      }}>
        {segs.map((s, i) => {
          const pct = (s.size / total) * 100;
          if (pct < 0.5) return null;
          return (
            <div key={s.key} title={`${s.label}: ${fmtBytes(s.size)} (${pct.toFixed(1)}%)`}
              style={{
                width: `${pct}%`,
                background: s.color === 'rgba(255,255,255,0.18)'
                  ? s.color : `linear-gradient(180deg, ${s.color}, ${s.color}cc)`,
                display: 'flex', alignItems: 'center', justifyContent: 'center',

                borderRight: i < segs.length - 1 ? '1px solid rgba(0,0,0,0.2)' : 'none',
                whiteSpace: 'nowrap',

              {pct >= 7 ? `${pct.toFixed(0)}%` : ''}

      {/* Legend with detail */}

        {segs.map(s => (
          <div key={s.key} style={{
            display: 'flex', alignItems: 'center', gap: 10,

            background: 'rgba(255,255,255,0.02)',
            border: `1px solid ${C.border}`,

              width: 30, height: 30, borderRadius: 8,

          display: 'inline-flex', alignItems: 'center', gap: 8,
        }}>
          <IconWarn size={14}/>

      )}

      <div style={{
        background: 'rgba(0,0,0,0.25)',

        borderRadius: 12, padding: 16,
        fontFamily: 'Inter',
      }}>
        {rows.length === 0 ? (
          <div style={{ color: C.text3, fontSize: 13, textAlign: 'center', padding: 24 }}>
            No se detectaron headings.
          </div>
        ) : rows.map((row, i) => (
          <div key={i} style={{
            position: 'relative',
            paddingLeft: indents[row.level],
            marginBottom: 8,
          }}>
            {row.level !== 'h1' && (
              <div style={{
                position: 'absolute', left: indents[row.level] - 12, top: 0, bottom: '50%',
                width: 1, background: 'rgba(255,255,255,0.1)',
              }}/>
            )}
            {row.level !== 'h1' && (
              <div style={{
                position: 'absolute', left: indents[row.level] - 12, top: '50%',
                width: 8, height: 1, background: 'rgba(255,255,255,0.1)',
              }}/>
            )}
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
              <span style={{
                fontFamily: 'JetBrains Mono, monospace', fontSize: 10,
                color: tones[row.level], fontWeight: 700,
                background: row.level === 'h1' ? C.greenSoft : 'rgba(255,255,255,0.04)',
                border: row.level === 'h1' ? `1px solid ${C.greenBorder}` : `1px solid ${C.border}`,
                padding: '1px 5px', borderRadius: 4,
                flexShrink: 0,
              }}>{row.level.toUpperCase()}</span>
              <span style={{
                fontFamily: row.level === 'h1' ? 'Syne' : 'Inter',
                fontSize: sizes[row.level],
                fontWeight: row.level === 'h1' ? 700 : row.level === 'h2' ? 600 : 500,
                color: tones[row.level],
                letterSpacing: row.level === 'h1' ? '-0.015em' : 0,
                lineHeight: 1.3,
              }}>{row.text}</span>
            </div>
          </div>
        ))}
      </div>
    </Card>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Content metrics
// ─────────────────────────────────────────────────────────────────────────────
function ContentMetrics({ content }) {
  const readability = content.flesch_kincaid_readability_index;
  const readColor = readability >= 60 ? C.green : readability >= 30 ? C.amber : C.red;
  const readLabel = readability >= 90 ? 'Muy fácil' : readability >= 60 ? 'Plain English' : readability >= 30 ? 'Difícil' : 'Muy difícil';

  return (
    <Card style={{ padding: 24, height: '100%' }}>
      <SectionTitle title="Contenido" sub="Análisis lingüístico y de consistencia"/>

      {/* Word count */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 20 }}>
        <div style={{
          width: 40, height: 40, borderRadius: 10,
          background: content.plain_text_word_count < 300 ? 'rgba(239,68,68,0.15)' : C.greenSoft,
          border: `1px solid ${content.plain_text_word_count < 300 ? 'rgba(239,68,68,0.35)' : C.greenBorder}`,
          color: content.plain_text_word_count < 300 ? C.red : C.green,
          display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
        }}><IconText size={18}/></div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 11, color: C.text3, letterSpacing: '0.06em', textTransform: 'uppercase', fontWeight: 600 }}>
            Palabras
          </div>
          <div style={{
            fontFamily: 'Syne', fontWeight: 800, fontSize: 28,
            color: content.plain_text_word_count < 300 ? C.red : C.text,
            lineHeight: 1.1,
          }}>{content.plain_text_word_count}</div>
        </div>
        {content.plain_text_word_count < 300 && (
          <Badge tone="red"><IconWarn size={11}/> Bajo</Badge>
        )}
      </div>

      {/* Readability */}
      <div style={{ marginBottom: 18 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ fontSize: 13, color: C.text2, fontWeight: 500 }}>Legibilidad (Flesch-Kincaid)</span>
            <Tooltip content="Escala 0-100. 0-30 muy difícil, 60-70 plain English, 90-100 muy fácil. Google recomienda 60+ para audiencias generales." width={260}>
              <span style={{ color: C.text4, display: 'inline-flex', cursor: 'help' }}><IconInfo size={12}/></span>
            </Tooltip>
          </div>
          <span style={{
            fontFamily: 'JetBrains Mono, monospace', fontSize: 14,
            color: readColor, fontWeight: 600,
          }}>{readability}</span>
        </div>
        <div style={{
          height: 8, borderRadius: 999,
          background: 'rgba(255,255,255,0.05)', overflow: 'hidden',
          position: 'relative',
        }}>
          {/* Range markers at 30 and 60 */}
          <div style={{
            position: 'absolute', left: '30%', top: 0, bottom: 0, width: 1,
            background: 'rgba(255,255,255,0.15)',
          }}/>
          <div style={{
            position: 'absolute', left: '60%', top: 0, bottom: 0, width: 1,
            background: 'rgba(255,255,255,0.15)',
          }}/>
          <div style={{
            width: `${readability}%`, height: '100%',
            background: `linear-gradient(90deg, ${readColor}cc, ${readColor})`,
            borderRadius: 999,
            boxShadow: `0 0 12px ${readColor}40`,
          }}/>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6, fontSize: 10, color: C.text3, fontFamily: 'JetBrains Mono, monospace' }}>
          <span>Difícil</span>
          <span>Plain English</span>
          <span>Muy fácil</span>
        </div>
        <div style={{
          marginTop: 10, fontSize: 12, color: readColor, fontWeight: 600,
          display: 'inline-flex', alignItems: 'center', gap: 6,
        }}>
          {readLabel}
        </div>
      </div>

      {/* Consistency bars */}
      <ConsistencyBar
        label="Consistencia título ↔ contenido"
        value={content.title_to_content_consistency}
        tooltip="Mide cuánto el contenido refleja el título de la página"
      />
      <ConsistencyBar
        label="Consistencia descripción ↔ contenido"
        value={content.description_to_content_consistency}
        tooltip="Mide cuánto el contenido refleja la meta descripción"
      />
    </Card>
  );
}

function ConsistencyBar({ label, value, tooltip }) {
  const pct = Math.round(value * 100);
  const color = pct >= 70 ? C.green : pct >= 40 ? C.amber : C.red;
  return (
    <div style={{ marginTop: 12 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <span style={{ fontSize: 12.5, color: C.text2, fontWeight: 500 }}>{label}</span>
          {tooltip && (
            <Tooltip content={tooltip}>
              <span style={{ color: C.text4, display: 'inline-flex', cursor: 'help' }}><IconInfo size={11}/></span>
            </Tooltip>
          )}
        </div>
        <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 12, color: color, fontWeight: 600 }}>
          {pct}%
        </span>
      </div>
      <div style={{
        height: 6, borderRadius: 999,
        background: 'rgba(255,255,255,0.05)', overflow: 'hidden',
      }}>
        <div style={{
          width: `${pct}%`, height: '100%',
          background: `linear-gradient(90deg, ${color}cc, ${color})`,
          borderRadius: 999,
          transition: 'width 0.6s cubic-bezier(0.2, 0.9, 0.3, 1)',
        }}/>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Resource errors / warnings (accordion)
// ─────────────────────────────────────────────────────────────────────────────
function AccordionSection({ title, count, icon, color, items, defaultOpen = false }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div style={{
      background: 'rgba(255,255,255,0.02)',
      border: `1px solid ${C.border}`,
      borderRadius: 12, overflow: 'hidden',
    }}>
      <button onClick={() => setOpen(o => !o)} style={{
        width: '100%', display: 'flex', alignItems: 'center', gap: 12,
        padding: '14px 18px',
        background: open ? `${color}10` : 'transparent',
        border: 'none', cursor: 'pointer', textAlign: 'left',
        color: C.text, transition: 'all 0.15s',
      }}>
        <div style={{
          width: 30, height: 30, borderRadius: 8,
          background: `${color}22`,
          border: `1px solid ${color}55`,
          color, flexShrink: 0,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>{icon}</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: C.text }}>{title}</div>
          <div style={{ fontSize: 11.5, color: C.text3, marginTop: 2 }}>
            {count === 0 ? 'Sin problemas detectados' : `${count} encontrado${count === 1 ? '' : 's'}`}
          </div>
        </div>
        <Badge tone={count === 0 ? 'green' : color === C.red ? 'red' : 'amber'}>{count}</Badge>
        <span style={{ color: C.text3, display: 'inline-flex', transition: 'transform 0.2s', transform: open ? 'rotate(90deg)' : 'none' }}>
          <IconChevRight size={16}/>
        </span>
      </button>
      {open && items.length > 0 && (
        <div style={{ borderTop: `1px solid ${C.border}` }}>
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr>
                <th style={{
                  padding: '10px 18px', fontSize: 10.5, fontWeight: 600,
                  color: C.text3, letterSpacing: '0.07em', textTransform: 'uppercase',
                  textAlign: 'left', width: 110,
                  borderBottom: `1px solid ${C.border}`,
                }}>Línea : Col</th>
                <th style={{
                  padding: '10px 18px', fontSize: 10.5, fontWeight: 600,
                  color: C.text3, letterSpacing: '0.07em', textTransform: 'uppercase',
                  textAlign: 'left',
                  borderBottom: `1px solid ${C.border}`,
                }}>Mensaje</th>
                <th style={{
                  padding: '10px 18px', fontSize: 10.5, fontWeight: 600,
                  color: C.text3, letterSpacing: '0.07em', textTransform: 'uppercase',
                  textAlign: 'right', width: 90,
                  borderBottom: `1px solid ${C.border}`,
                }}>HTTP</th>
              </tr>
            </thead>
            <tbody>
              {items.map((it, i) => (
                <tr key={i}>
                  <td style={{
                    padding: '11px 18px', borderBottom: i < items.length - 1 ? `1px solid ${C.border}` : 'none',
                    fontFamily: 'JetBrains Mono, monospace', fontSize: 12, color: C.text2,
                  }}>{it.line}:{it.column}</td>
                  <td style={{
                    padding: '11px 18px', borderBottom: i < items.length - 1 ? `1px solid ${C.border}` : 'none',
                    fontFamily: 'JetBrains Mono, monospace', fontSize: 12, color: C.text, lineHeight: 1.4,
                  }}>{it.message}</td>
                  <td style={{
                    padding: '11px 18px', borderBottom: i < items.length - 1 ? `1px solid ${C.border}` : 'none',
                    textAlign: 'right',
                  }}>
                    <Badge tone={it.status_code >= 400 ? 'red' : it.status_code >= 300 ? 'amber' : it.status_code === 0 ? 'red' : 'default'} style={{ fontFamily: 'JetBrains Mono, monospace' }}>
                      {it.status_code || 'N/A'}
                    </Badge>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

        sub="Cómo aparece esta página en Google, Facebook/LinkedIn y X"
      />
      <div className="social-grid" style={{
        display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16,
      }}>
        <GoogleSerpPreview
          title={data.title} description={data.description} url={data.url}
          duplicateTitle={data.duplicate_title} duplicateDescription={data.duplicate_description}
        />
        <FacebookCard tags={data.social_media_tags} url={data.url}/>
        <TwitterCard tags={data.social_media_tags} url={data.url}/>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Ops footer
// ─────────────────────────────────────────────────────────────────────────────
function OpsFooter({ data }) {
  return (
    <Card style={{ padding: '16px 22px', marginTop: 36 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 24, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', gap: 28, alignItems: 'center', flexWrap: 'wrap' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: C.text3, fontSize: 12 }}>
            <IconDollar size={14}/>
            <span style={{ color: C.text2, fontFamily: 'JetBrains Mono, monospace' }}>${data.cost.toFixed(4)} USD</span>
            <span>· costo del análisis</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: C.text3, fontSize: 12 }}>
            <IconClock size={14}/>
            <span style={{ color: C.text2, fontFamily: 'JetBrains Mono, monospace' }}>{data.task_time}</span>
            <span>· tiempo de respuesta</span>
          </div>
        </div>
        <button style={{
          display: 'inline-flex', alignItems: 'center', gap: 8,
          background: C.green, color: C.bg, border: 'none',
          fontWeight: 700, fontSize: 13, padding: '10px 18px',
          borderRadius: 9, cursor: 'pointer',
          fontFamily: 'Inter', transition: 'all 0.15s',
        }}
        onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-1px)'; e.currentTarget.style.boxShadow = `0 6px 20px ${C.green}40`; }}
        onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = 'none'; }}>
          Re-analizar página <IconExternal size={13}/>
        </button>
      </div>
    </Card>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Main dashboard
// ─────────────────────────────────────────────────────────────────────────────
function OnPageAuditDashboard({ data }) {
  return (
    <div>
      {/* Hero */}
      <div style={{ marginBottom: 28 }}>
        <HeroCard data={data}/>
      </div>

      {/* HTTP status */}
      <div className="two-col" style={{
        display: 'grid', gridTemplateColumns: '1fr 2fr',
        gap: 16, marginBottom: 36, alignItems: 'stretch',
      }}>
        <HttpStatusDonut statusCode={data.status_code} statusClass={data.health.http_status_class}/>
        <Card style={{ padding: 24, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 14 }}>
          <SectionTitle title="Resumen rápido" sub="Lo principal que aprender de esta auditoría"/>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 10 }}>
            {[
              { label: 'OnPage Score', value: data.health.onpage_score, of: 100, color: scoreColor(data.health.onpage_score) },
              { label: 'Health Score', value: data.health.computed_health_score, of: 100, color: scoreColor(data.health.computed_health_score) },
              { label: 'Issues', value: data.health.issues_count, color: C.red },
              { label: 'Checks ✓', value: data.health.passing_count, color: C.green },
            ].map((s, i) => (
              <div key={i} style={{
                padding: '12px 14px', borderRadius: 10,
                background: 'rgba(255,255,255,0.025)', border: `1px solid ${C.border}`,
              }}>
                <div style={{ fontSize: 10.5, color: C.text3, letterSpacing: '0.06em', textTransform: 'uppercase', fontWeight: 600 }}>{s.label}</div>
                <div style={{
                  fontFamily: 'Syne', fontWeight: 800, fontSize: 22,
                  color: s.color, lineHeight: 1.1, marginTop: 4,
                }}>
                  {s.value}{s.of && <span style={{ color: C.text3, fontWeight: 500, fontSize: 14 }}>/{s.of}</span>}
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      {/* Issues + Passing checks */}
      <div className="two-col" style={{
        display: 'grid', gridTemplateColumns: '1fr 1fr',
        gap: 16, marginBottom: 36, alignItems: 'stretch',
      }}>
        <IssuesCard issues={data.issues}/>
        <PassingChecksCard checks={data.passing_checks}/>
      </div>

      {/* Performance */}
      <div style={{ marginBottom: 36 }}>
        <PerformanceGauges perf={data.performance}/>
      </div>

      {/* Resources */}
      <div style={{ marginBottom: 36 }}>
        <ResourcesBar rb={data.resources_breakdown} pageSize={data.performance.page_size_bytes}/>
      </div>

      {/* Headings + Content metrics */}
      <div className="two-col" style={{
        display: 'grid', gridTemplateColumns: '1.4fr 1fr',
        gap: 16, marginBottom: 36, alignItems: 'stretch',
      }}>
        <HeadingsHierarchy headings={data.headings} headingsCount={data.headings_count}/>
        <ContentMetrics content={data.content}/>
      </div>

      {/* Resource errors */}
      <div style={{ marginBottom: 36 }}>
        <ResourceErrorsCard errors={data.resource_errors} warnings={data.resource_warnings}/>
      </div>

      {/* Social previews */}
      <SocialPreviews data={data}/>

      <OpsFooter data={data}/>
    </div>
  );
}
