// ─────────────────────────────────────────────────────────────────────────────
// Building blocks
// ─────────────────────────────────────────────────────────────────────────────
function Card({ children, style, ...rest }) {
  return (
    <div style={{
      background: C.card,
      border: `1px solid ${C.border}`,
      borderRadius: 16,
      ...style,
    }} {...rest}>{children}</div>
  );
}

function Badge({ children, tone = 'default', style }) {
  const tones = {
    default: { bg: 'rgba(255,255,255,0.06)', fg: C.text2, br: 'rgba(255,255,255,0.1)' },
    green:   { bg: C.greenSoft, fg: C.green, br: C.greenBorder },
    yellow:  { bg: 'rgba(251,191,36,0.12)', fg: C.yellow, br: 'rgba(251,191,36,0.3)' },
    red:     { bg: 'rgba(239,68,68,0.12)', fg: C.red, br: 'rgba(239,68,68,0.3)' },
    blue:    { bg: 'rgba(96,165,250,0.12)', fg: C.blue, br: 'rgba(96,165,250,0.3)' },
  }[tone];
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5,
      background: tones.bg, color: tones.fg,
      border: `1px solid ${tones.br}`,
      fontSize: 11, fontWeight: 600,
      padding: '3px 9px', borderRadius: 999,
      letterSpacing: '0.01em',
      ...style,
    }}>{children}</span>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// KPI cards
// ─────────────────────────────────────────────────────────────────────────────
function KpiCard({ icon, label, value, sub, accent }) {
  return (
    <Card style={{ padding: '20px 22px', display: 'flex', flexDirection: 'column', gap: 14, minHeight: 132 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <div style={{
          width: 36, height: 36, borderRadius: 10,
          background: accent ? `${C.greenSoft}` : 'rgba(255,255,255,0.06)',
          color: accent ? C.green : C.text2,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          border: `1px solid ${accent ? C.greenBorder : C.border}`,
        }}>
          {icon}
        </div>
        <div style={{
          fontFamily: 'Inter', fontSize: 11,
          color: C.text3, letterSpacing: '0.06em',
          textTransform: 'uppercase', fontWeight: 600,
          textAlign: 'right',
        }}>{label}</div>
      </div>
      <div style={{ marginTop: 'auto' }}>
        <div style={{
          fontFamily: 'Syne, sans-serif', fontWeight: 800,
          fontSize: 36, lineHeight: 1,
          color: accent ? C.green : C.text,
          letterSpacing: '-0.02em',
        }}>{value}</div>
        {sub && (
          <div style={{
            fontSize: 12, color: C.text3, marginTop: 6,
            fontFamily: 'Inter',
          }}>{sub}</div>
        )}
      </div>
    </Card>
  );
}

function KpiRow({ data }) {
  const tv = data.target_visibility;
  const targetCard = (() => {
    if (!tv) return null;
    if (!tv.found) {
      return (
        <KpiCard
          icon={<IconTarget size={18} />}
          label="Tu posición"
          value={<span style={{ fontSize: 22, fontFamily: 'Syne', fontWeight: 700 }}>No rankeas aún</span>}
          sub={tv.domain}
        />
      );
    }
    const tone = tv.in_top_3 ? 'top-3' : tv.in_top_10 ? 'top-10' : 'fuera';
    return (
      <KpiCard
        icon={<IconTarget size={18} />}
        label="Tu posición"
        value={`#${tv.position}`}
        sub={tone === 'top-3' ? 'En el top 3 — excelente' : tone === 'top-10' ? 'En la primera página' : 'Fuera del top 10'}
        accent={true}
      />
    );
  })();

  return (
    <div className="kpi-grid" style={{
      display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)',
      gap: 16, marginBottom: 28,
    }}>
      <KpiCard
        icon={<IconTrendingUp size={18} />}
        label="Posición promedio"
        value={data.average_position?.toFixed(1) ?? '—'}
        sub="entre los resultados orgánicos"
      />
      <KpiCard
        icon={<IconLayers size={18} />}
        label="Funciones SERP"
        value={data.serp_features_count}
        sub={data.serp_features.slice(0, 2).map(f => f.replace(/_/g, ' ')).join(' · ')}
      />
      <KpiCard
        icon={<IconList size={18} />}
        label="Resultados orgánicos"
        value={data.organic_results_count}
        sub={`${fmtNum(data.total_results_google)} en total`}
      />
      {targetCard}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Ranking distribution — horizontal bar chart (custom SVG, recharts-style)
// ─────────────────────────────────────────────────────────────────────────────
function RankingDistribution({ dist, total }) {
  const rows = [
    { label: 'Top 3',   value: dist.top_3,   tone: C.green },
    { label: 'Top 10',  value: dist.top_10,  tone: '#4ade80' },
    { label: 'Top 20',  value: dist.top_20,  tone: '#86efac' },
    { label: 'Top 100', value: dist.top_100, tone: 'rgba(255,255,255,0.25)' },
  ];
  const max = Math.max(...rows.map(r => r.value), 1);

  return (
    <Card style={{ padding: 24, display: 'flex', flexDirection: 'column', gap: 18 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <div>
          <h3 style={{
            fontFamily: 'Syne', fontWeight: 700, fontSize: 17,
            color: C.text, letterSpacing: '-0.01em', marginBottom: 4,
          }}>Distribución de ranking</h3>
          <p style={{ fontSize: 12, color: C.text3 }}>
            Cuántos resultados aparecen en cada rango de posiciones
          </p>
        </div>
        <Badge tone="default">{total} resultados</Badge>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 14, marginTop: 4 }}>
        {rows.map((r, i) => {
          const pct = (r.value / max) * 100;
          return (
            <div key={i} style={{ display: 'grid', gridTemplateColumns: '60px 1fr 32px', gap: 12, alignItems: 'center' }}>
              <div style={{
                fontSize: 12, color: C.text2, fontWeight: 500,
                fontFamily: 'JetBrains Mono, monospace',
              }}>{r.label}</div>

function renderMarkdown(md) {
  // Tiny markdown: **bold** and paragraphs split on \n\n
  const paragraphs = md.split(/\n\n+/);
  return paragraphs.map((p, i) => {
    const parts = p.split(/(\*\*[^*]+\*\*)/g).map((seg, j) => {
      if (seg.startsWith('**') && seg.endsWith('**')) {
        return <strong key={j} style={{ color: C.text, fontWeight: 600 }}>{seg.slice(2, -2)}</strong>;
      }
      return <React.Fragment key={j}>{seg}</React.Fragment>;
    });
    return <p key={i} style={{ marginBottom: i < paragraphs.length - 1 ? 12 : 0 }}>{parts}</p>;
  });
}

function highlightText(text, terms) {
  if (!terms || terms.length === 0) return text;
  const escaped = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const re = new RegExp(`(${escaped.join('|')})`, 'gi');
  const parts = text.split(re);
  return parts.map((p, i) =>
    re.test(p) ? <mark key={i}>{p}</mark> : <React.Fragment key={i}>{p}</React.Fragment>
  );
}

    const arr = [...rows];
    arr.sort((a, b) => {
      let va = a[sort.key], vb = b[sort.key];
      if (sort.key === 'sitelinks') { va = a.sitelinks.length; vb = b.sitelinks.length; }
      if (sort.key === 'domain' || sort.key === 'title') {
        return sort.dir === 'asc' ? String(va).localeCompare(vb) : String(vb).localeCompare(va);
      }
      return sort.dir === 'asc' ? va - vb : vb - va;
    });
    return arr;
