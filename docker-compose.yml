services:

  # ─── API ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - apps/api/.env
    volumes:
      # Hot reload: monta el código fuente en desarrollo
      - ./apps/api/src:/app/src
    command: >
      uv run uvicorn src.main:app
        --host 0.0.0.0
        --port 8000
        --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── WORKER ───────────────────────────────────────────────────────────────────
  worker:
    build:
      context: apps/api
      dockerfile: Dockerfile
    env_file:
      - apps/api/.env
    volumes:
      - ./apps/api/src:/app/src
    command: >
      uv run celery -A src.worker.celery_app worker
        --loglevel=info
        --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── POSTGRESQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: growth_radar
    ports:
      - "5435:5432"  # 5432-5434 ocupados por instancias locales
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d growth_radar"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── REDIS ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # 6379 ocupado por Redis local del sistema
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
